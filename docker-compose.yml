# No `container_name`: compose names the container after the checkout's directory, so two checkouts do not collide
# on a fixed name. They do still share the 5432 binding, which is correct — they would be the same `DATABASE_URL`.
services:
  postgres:
    # Held at 16 to match the integration-test container in `Jenkinsfile_CNP` and the AAT server in
    # `infrastructure/postgres.tf`: the migrations here are hand-written SQL, so a local server ahead of those would
    # accept syntax the gate and the deployed database reject.
    image: postgres:16-alpine
    # Durability off, because nothing on this server is worth recovering: it holds `yarn dev`'s database and the
    # integration suite's, both of which are rebuilt by a migrate. It is the largest single thing the suite's speed
    # turns on — every test that touches the database commits about seven times, and each `DROP DATABASE` forces a
    # checkpoint. Measured over the whole suite: 528s to 77s serial, and 117s to 18s across the workers. An unclean
    # stop can leave the data directory unreadable; `docker compose down -v` and a migrate is the repair.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_USER: hmcts
      # Local only. The deployed database takes its credentials from the dtsse Key Vault.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmcts -d agent_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Blob Storage for prototype feedback's recordings and snapshots, which `yarn dev` reaches with
  # `FEEDBACK_STORAGE_CONNECTION_STRING=UseDevelopmentStorage=true`; the hub makes the container and opens CORS itself.
  # In memory, because nothing on it is worth keeping. `--skipApiVersionCheck` because the SDK asks for service
  # versions newer than Azurite knows of.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --inMemoryPersistence
      - --skipApiVersionCheck
      - --loose
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
