# No `container_name`: compose names the container after the checkout's directory, so two checkouts do not collide
# on a fixed name. They do still share the 5432 binding, which is correct — they would be the same `DATABASE_URL`.
services:
  postgres:
    image: postgres:18-alpine
    # Durability off, because nothing on this server is worth recovering: it holds `yarn dev`'s database and the
    # integration suite's, both of which are rebuilt by a migrate. It is the largest single thing the suite's speed
    # turns on — every test that touches the database commits about seven times, and each `DROP DATABASE` forces a
    # checkpoint. Measured over the whole suite: 528s to 77s serial, and 117s to 18s across the workers. An unclean
    # stop can leave the data directory unreadable; `docker compose down -v` and a migrate is the repair.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_USER: hmcts
      # Local only. The deployed database takes its credentials from the dtsse Key Vault.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    # The mount is the parent, not `data/`: from 18 the image keeps the cluster in a major-version directory
    # (`/var/lib/postgresql/18/docker`) and refuses to start if it finds a mount at the old `data/` path.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmcts -d agent_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
