# SonarCloud's automatic analysis, the "SonarCloud Code Analysis" check on pull requests, reads this file;
# sonar-project.properties is for the Jenkins scan.
#
# Two files are byte-identical copies, each held to its original by a test, so their duplication is the point rather
# than a defect and they must not be refactored apart:
# - src/assistant/slides/masters.ts copies the slides plugin's own
#   packages/agent-hub/plugins/slides/scripts/slides-lib/masters.ts (src/assistant/slides/masters.test.ts). The hub
#   cannot import the plugin, since its image copies only src/.
# - packages/agent-hub/src/deck-diff.ts copies src/assistant/deck-diff.ts (src/assistant/deck-diff.test.ts). The
#   published client cannot import the hub.
sonar.cpd.exclusions=src/assistant/slides/masters.ts,packages/agent-hub/src/deck-diff.ts
