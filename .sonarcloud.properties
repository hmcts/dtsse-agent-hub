# SonarCloud's automatic analysis, the "SonarCloud Code Analysis" check on pull requests, reads this file;
# sonar-project.properties is for the Jenkins scan.
#
# src/assistant/slides/masters.ts is a byte-identical copy of the slides plugin's own
# packages/agent-hub/plugins/slides/scripts/slides-lib/masters.ts, held to it by
# src/assistant/slides/masters.test.ts. The hub cannot import the plugin, since its image copies only src/, and the
# copy must not be refactored apart from the original, so its duplication is the point rather than a defect.
sonar.cpd.exclusions=src/assistant/slides/masters.ts
