name: Release the client

# The published client is one workspace package beside the app. The app is released as a Docker
# image by Jenkins (Jenkinsfile_CNP); this publishes @hmcts-cft/agent-hub to Azure Artifacts, and
# only when that package changed — otherwise every web-UI commit would cut a client release.
on:
  push:
    branches: [master]
    paths:
      - 'packages/agent-hub/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Never cancel a release in progress: two overlapping publishes would race on the version number
# and one of them would publish a version that is already taken.
concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Jenkins runs on pull requests, not on a push to master, so without this a direct push to
  # master would publish whatever it was given.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # The hmcts-lib feed allows anonymous reads, so this needs no credential. Only publishing
      # does; see the release job.
      - name: Install
        # --mode=skip-build: do not run dependencies' lifecycle scripts. Nothing here needs them, and the
        # release job holds the credential that can publish, so an install is the wrong place to execute
        # third-party code. Verified: install and the client build both succeed without them.
        run: yarn install --immutable --mode=skip-build

      # `yarn typecheck` covers the app as well as the package, and the app's types do not exist
      # until the Prisma client is generated.
      - name: Generate the Prisma client
        run: yarn db:generate

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # The package's own suite and thresholds. Not `yarn test`, which also runs the app's and
      # needs a database.
      - name: Test the client
        run: yarn workspace @hmcts-cft/agent-hub run test:coverage

      - name: Build the client
        run: yarn workspace @hmcts-cft/agent-hub run build

      # The bins are bash and are not compiled, so a packaging mistake is invisible to tsc.
      - name: Check the tarball contents
        working-directory: packages/agent-hub
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const pkg = require("./package.json");
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            // Derived from the manifest so a new bin is covered without touching this workflow.
            const bins = typeof pkg.bin === "string" ? [pkg.bin] : Object.values(pkg.bin ?? {});
            const required = [...bins, "secret-patterns", "dist/cli.js"];
            const missing = required.filter((f) => !files.includes(f));
            const leaked = files.filter((f) => /^src\/|\.test\.|__fixtures__/.test(f));
            if (missing.length) throw new Error("missing from the tarball: " + missing.join(", "));
            if (leaked.length) throw new Error("should not be published: " + leaked.join(", "));
            console.log(files.length + " files, nothing leaked");
          '

      - name: Shellcheck the bins
        run: shellcheck -s bash packages/agent-hub/bin/*

  release:
    needs: gates
    runs-on: ubuntu-latest
    # No id-token: npm provenance is npmjs.org-only and Azure Artifacts does not support it.
    permissions:
      contents: write
    steps:
      # The commit the gates ran against, not the tip of the branch: on a `push` event those differ as soon as
      # a second merge lands, and the tip is code that lint, the typecheck, the tests and the tarball check
      # have never seen. Nothing in this job needs history behind that commit — the tag below names it, and
      # the remote already has it — so the default shallow fetch is enough.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        # --mode=skip-build: do not run dependencies' lifecycle scripts. Nothing here needs them, and the
        # release job holds the credential that can publish, so an install is the wrong place to execute
        # third-party code. Verified: install and the client build both succeed without them.
        run: yarn install --immutable --mode=skip-build

      - name: Build the client
        run: yarn workspace @hmcts-cft/agent-hub run build

      # Kept line-for-line from cnp-githubactions-library/npm-publish-library so that moving to
      # the shared action later is a straight substitution.
      # Deliberately after the install: until this step runs, the publish credential is neither on disk nor
      # in any step's environment, so nothing that an install executes could read it. Keep it in this order.
      - name: Configure npm authentication for Azure Artifacts
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          FEED_URL: https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/
          NPM_SCOPE: '@hmcts-cft'
        run: |
          token_b64="$(printf %s "$AZURE_DEVOPS_ARTIFACT_TOKEN" | base64 | tr -d '\n')"
          username="${AZURE_DEVOPS_ARTIFACT_USERNAME:-github}"
          feed="${FEED_URL%/}/"
          # Strip the scheme to build the npm-style "//host/path/" auth keys.
          feed_no_scheme="${feed#https:}"
          # Deliberately no default `registry=` line. The feed hosts only @hmcts-cft/*, so making it the
          # default sends every public package there and npm 404s on the first one it cannot find — which is
          # what broke the first release run. The scoped entry below, plus publishConfig.registry in
          # package.json, is all a publish needs.
          cat > "$HOME/.npmrc" <<EOF
          always-auth=true
          ${feed_no_scheme}:username=${username}
          ${feed_no_scheme}:_password=${token_b64}
          ${feed_no_scheme}:email=github-actions@hmcts.net
          EOF
          # Defend against publishConfig.registry going missing — npm prefers @<scope>:registry
          # over the default `registry=` line.
          echo "@${NPM_SCOPE#@}:registry=${feed}" >> "$HOME/.npmrc"

      # The next version is always the highest the feed holds with its patch raised by one. This workflow
      # releases patches and nothing else: a minor or a major bump is not something it can express, and making
      # one means publishing by hand or changing this step.
      #
      # packages/agent-hub/package.json's version is not what gets published, and is not maintained: the bump
      # is never committed back (see the tag step), so nothing keeps it in step with the feed and nothing else
      # in the repository reads it. The one thing it is still read for is the first-ever publish, when the
      # feed holds no version to count from.
      #
      # Reads need no credential, but this runs after the npmrc is written so that it reads the same feed
      # publishing will write to.
      - name: Work out the next version
        id: bump
        working-directory: packages/agent-hub
        run: |
          err="$(mktemp)"
          if published="$(npm view "$(node -p 'require("./package.json").name')" versions --json 2>"$err")"; then
            echo "the feed holds: $published"
          elif grep -q 'E404' "$err"; then
            # The package itself is unknown to the feed, so this is the first publish and the manifest's
            # version is where it starts.
            echo "the feed does not hold this package yet"
            published="[]"
          else
            # Any other answer is the feed failing to say what it holds, not an empty feed. Treating the two
            # alike would fall back to the manifest, which is behind every version already published, and the
            # publish below would die on a version that is taken.
            cat "$err" >&2
            echo "::error::could not read the published versions from the feed"
            exit 1
          fi
          # The node script is single-quoted so that the shell leaves its `$` anchors alone (SC2016); the one
          # value it needs comes in through the environment.
          # shellcheck disable=SC2016
          version="$(PUBLISHED="$published" node -e '
            const parse = (v) => (/^\d+\.\d+\.\d+$/.test(v) ? v.split(".").map(Number) : null);
            const order = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            let raw = [];
            try {
              raw = JSON.parse(process.env.PUBLISHED);
            } catch {}
            // `npm view` answers with a bare string when the feed holds exactly one version, and prereleases
            // are not ours to patch, so anything that is not a plain x.y.z is dropped.
            const released = (Array.isArray(raw) ? raw : [raw]).map(parse).filter((v) => v !== null).sort(order);
            const highest = released[released.length - 1];
            console.log(highest ? [highest[0], highest[1], highest[2] + 1].join(".") : require("./package.json").version);
          ')"
          # `npm pkg set` edits the manifest and nothing else. `npm version` also reifies the dependency
          # tree, which in a Yarn workspace with no package-lock.json resolves every dependency for no reason
          # and fails on the first public one the feed does not hold.
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: packages/agent-hub
        run: npm publish

      # Publish first: a tag with no package behind it is worse than an untagged release. The tag is this
      # repository's record of what was published, because the bump is not committed back: master's ruleset
      # requires a pull request, which GITHUB_TOKEN cannot be granted a bypass from, and the version above
      # comes from the feed rather than the manifest.
      #
      # The push is retried rather than allowed to fail: the version is on the feed by the time it runs, so a
      # re-run dies at `npm publish` with a 409 and the tag would never be written. A push that goes on
      # failing still fails the job — a release nobody can trace back to a commit is what this step prevents.
      - name: Tag the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          tag="agent-hub-v${VERSION}"
          git tag "$tag"
          attempt=1 delay=5
          until git push origin "$tag"; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::${VERSION} is published but ${tag} could not be pushed; tag ${GITHUB_SHA} by hand"
              exit 1
            fi
            echo "pushing ${tag} failed (attempt ${attempt} of 5); retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
