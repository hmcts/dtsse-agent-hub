sonar.projectName=dtsse-agent-hub
sonar.projectKey=dtsse-agent-hub
sonar.language=typescript
sonar.sources=src,packages/agent-hub/src
sonar.tests=src,packages/agent-hub/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info,packages/agent-hub/coverage/lcov.info
sonar.exclusions=src/app/pwa-icon/icons.ts,src/instrumentation.ts,src/instrumentation-node.ts,src/proxy.ts,test/**,src/store/generated/**,packages/agent-hub/dist/**,packages/agent-hub/src/__fixtures__/**
sonar.coverage.exclusions=src/app/**/*.tsx,src/cli/**,packages/agent-hub/src/index.ts,packages/agent-hub/src/stop-worker/index.ts,packages/agent-hub/src/virtual/index.ts

# Three rules do not fit the published client, so they are excluded for it alone rather than suppressed
# in SonarCloud, where the reasoning would not be visible in review.
#
# S4036 asks that a spawned command be an absolute path in a fixed directory. The client's whole job
# is to drive the tools the session already has — git, gh, az, twg, tmux, claude — and under nvm or a
# devcontainer those are wherever PATH says. Pinning absolute paths would break it everywhere.
#
# S6324 objects to control characters in a regex. `virtual/sign-in.ts` parses the TUI that
# `claude setup-token` draws, and an OSC 8 hyperlink is delimited by ESC and BEL: the control
# characters are the thing being matched. Biome has the same rule and the same per-line exemptions.
#
# S1751 objects to an `await` inside a loop. `githubLogin` relays its codes one at a time on purpose:
# each attempt has to see what the one before it did before it decides whether another is owed, and the
# wait between them exists so that a fault which may not last is given time not to. Running them
# together would relay every code at once, which is the fault the loop was written to stop.
sonar.issue.ignore.multicriteria=clientPath,ansiEscapes,sequentialCodes
sonar.issue.ignore.multicriteria.clientPath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.clientPath.resourceKey=packages/agent-hub/src/**/*.ts
sonar.issue.ignore.multicriteria.ansiEscapes.ruleKey=typescript:S6324
sonar.issue.ignore.multicriteria.ansiEscapes.resourceKey=packages/agent-hub/src/virtual/sign-in.ts
sonar.issue.ignore.multicriteria.sequentialCodes.ruleKey=typescript:S1751
sonar.issue.ignore.multicriteria.sequentialCodes.resourceKey=packages/agent-hub/src/virtual/sign-in.ts
