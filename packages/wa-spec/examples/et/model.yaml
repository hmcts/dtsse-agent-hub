kind: wa-model
version: 1
service:
  slug: employment
  jurisdiction: EMPLOYMENT
  serviceCode: BHA1
  displayName: Employment
caseTypes:
  - id: et_englandwales
  - id: et_englandwales_multiple
  - id: et_scotland
  - id: et_scotland_multiple
layout: spec.layout.yaml
order: model.order.yaml
defaults:
  configuration:
    - name: caseName
      value:
        plus:
          - if:
              field: caseData.ethosCaseReference
              op: exists
            use:
              plus:
                - field: caseData.ethosCaseReference
                - " - "
            otherwise: ""
          - if:
              field: caseData.claimant
              op: exists
            use:
              field: caseData.claimant
            otherwise: Unknown
          - " v "
          - if:
              field: caseData.respondent
              op: exists
            use:
              field: caseData.respondent
            otherwise: Unknown
      reconfigure: true
      only: [ et_englandwales, et_scotland ]
    - name: caseName
      value:
        field: caseData.multipleName
      reconfigure: true
      only: [ et_englandwales_multiple, et_scotland_multiple ]
    - name: region
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.region
              op: exists
        use:
          field: caseData.caseManagementLocation.region
        otherwise: "1"
      reconfigure: true
      only: [ et_englandwales, et_englandwales_multiple ]
    - name: location
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.baseLocation
              op: exists
        use:
          field: caseData.caseManagementLocation.baseLocation
        otherwise: "369230"
      reconfigure: true
      only: [ et_englandwales ]
    - name: location
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.baseLocation
              op: exists
        use:
          field: caseData.caseManagementLocation.baseLocation
        otherwise: "21153"
      reconfigure: true
      only: [ et_englandwales_multiple ]
    - name: locationName
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.baseLocation
              op: exists
            - field: caseData.managingOffice
              op: exists
        use:
          field: caseData.managingOffice
        otherwise: London Central
      reconfigure: true
      only: [ et_englandwales, et_englandwales_multiple ]
    - name: region
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.region
              op: exists
        use:
          field: caseData.caseManagementLocation.region
        otherwise: "11"
      reconfigure: true
      only: [ et_scotland, et_scotland_multiple ]
    - name: location
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.baseLocation
              op: exists
        use:
          field: caseData.caseManagementLocation.baseLocation
        otherwise: "368308"
      reconfigure: true
      only: [ et_scotland, et_scotland_multiple ]
    - name: locationName
      value:
        if:
          all:
            - field: caseData.caseManagementLocation
              op: exists
            - field: caseData.caseManagementLocation.baseLocation
              op: exists
            - field: caseData.managingOffice
              op: exists
        use:
          field: caseData.managingOffice
        otherwise: Edinburgh
      reconfigure: true
      only: [ et_scotland, et_scotland_multiple ]
    - name: caseManagementCategory
      value:
        if:
          all:
            - field: caseData.caseManagementCategory
              op: exists
            - field: caseData.caseManagementCategory.selectedLabel
              op: exists
        use:
          field: caseData.caseManagementCategory.selectedLabel
        otherwise: Employment
      only: [ et_englandwales, et_scotland ]
    - name: caseManagementCategory
      value: Employment
      only: [ et_englandwales_multiple, et_scotland_multiple ]
    - name: nextHearingDate
      value:
        if:
          field: caseData.nextListedDate
          op: exists
        use:
          field: caseData.nextListedDate
        otherwise: ""
      reconfigure: true
    - name: calculatedDates
      value: nextHearingDate,dueDate,priorityDate
      only: [ et_englandwales, et_scotland ]
    - name: dueDateTime
      value:
        call: time
        args: [ 16:00 ]
      only: [ et_englandwales, et_scotland ]
    - name: dueDateOrigin
      value:
        call: now
        args: []
      only: [ et_englandwales, et_scotland ]
    - name: calculatedDates
      value: nextHearingDate,dueDate,priorityDate
      reconfigure: true
      only: [ et_englandwales_multiple, et_scotland_multiple ]
    - name: dueDateOrigin
      value:
        call: now
        args: []
      reconfigure: true
      only: [ et_englandwales_multiple, et_scotland_multiple ]
    - name: dueDateTime
      value:
        call: time
        args: [ 16:00 ]
      reconfigure: true
      only: [ et_englandwales_multiple, et_scotland_multiple ]
    - name: dueDateNonWorkingCalendar
      value: https://www.gov.uk/bank-holidays/england-and-wales.json, https://raw.githubusercontent.com/hmcts/et-wa-task-configuration/master/src/main/resources/privilege-calendar-engwales.json
      reconfigure: true
      only: [ et_englandwales, et_englandwales_multiple ]
    - name: dueDateNonWorkingCalendar
      value: https://www.gov.uk/bank-holidays/scotland.json, https://raw.githubusercontent.com/hmcts/et-wa-task-configuration/master/src/main/resources/privilege-calendar-scotland.json
      reconfigure: true
      only: [ et_scotland, et_scotland_multiple ]
    - name: dueDateNonWorkingDaysOfWeek
      value: SATURDAY,SUNDAY
      reconfigure: true
    - name: dueDateSkipNonWorkingDays
      value: "true"
      reconfigure: true
    - name: dueDateMustBeWorkingDay
      value: Yes
      reconfigure: true
  permissions:
    task-supervisor:
      perms: [ Read, Manage, Claim, Unclaim, Assign, Unassign, Complete ]
      autoAssign: false
      note: supervisor task permissions
    leadership-judge:
      perms: [ Read, Execute, Manage, Claim, Assign, Unassign, Complete ]
      priority: 5
      autoAssign: false
      note: Leadership Judge Permissions
roles:
  allocated-admin-caseworker:
    category: ADMIN
  hearing-centre-team-leader:
    category: ADMIN
  hearing-centre-admin:
    category: ADMIN
  allocated-ctsc-caseworker:
    category: CTSC
  ctsc-team-leader:
    category: CTSC
  ctsc:
    category: CTSC
  lead-judge:
    category: JUDICIAL
  hearing-judge:
    category: JUDICIAL
  judge:
    category: JUDICIAL
  fee-paid-judge:
    category: JUDICIAL
  allocated-tribunal-caseworker:
    category: LEGAL_OPERATIONS
  senior-tribunal-caseworker:
    category: LEGAL_OPERATIONS
  tribunal-caseworker:
    category: LEGAL_OPERATIONS
  regional-centre-team-leader:
    category: ADMIN
  regional-centre-admin:
    category: ADMIN
  specific-access-approver-judiciary:
    category: JUDICIAL
  specific-access-approver-legal-ops:
    category: LEGAL_OPERATIONS
  specific-access-approver-admin:
    category: ADMIN
  specific-access-approver-ctsc:
    category: CTSC
  task-supervisor: {}
  leadership-judge:
    category: JUDICIAL
permissionProfiles:
  adminAndCtscWorker:
    allocated-admin-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 2
      autoAssign: true
      note: Case Role for Auto Assignment - Allocated Admin Caseworker
    hearing-centre-team-leader:
      perms: [ Assign, Unassign, Complete, Cancel ]
      priority: 6
      autoAssign: false
    hearing-centre-admin:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 4
      autoAssign: false
    allocated-ctsc-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 1
      autoAssign: true
      note: Case Role for Auto Assignment - Allocated CTSC Caseworker
    ctsc-team-leader:
      perms: [ Assign, Unassign, Complete ]
      priority: 5
      autoAssign: false
    ctsc:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
      note: Access Request for CTSC
  adminWorker:
    allocated-admin-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 2
      autoAssign: true
      note: Case Role for Auto Assignment - Allocated Admin Caseworker
    hearing-centre-team-leader:
      perms: [ Assign, Unassign, Complete, Cancel ]
      priority: 6
      autoAssign: false
    hearing-centre-admin:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 4
      autoAssign: false
  judicialAndLegalOpsWorker:
    lead-judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 1
      autoAssign: true
      note: Case Role for Auto Assignment - Lead Judge Permissions
    hearing-judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 2
      autoAssign: true
      note: Case Role for Auto Assignment - Hearing Judge Permissions
    judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
      note: Judge Permissions
    fee-paid-judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
      note: Judge Permissions
    allocated-tribunal-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 1
      autoAssign: true
      note: Case Role for Auto Assignment - Allocated Tribunal Caseworker
    senior-tribunal-caseworker:
      perms: [ Assign, Unassign, Complete, Cancel ]
      priority: 4
      autoAssign: false
    tribunal-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
  judicialAndLegalOpsWorker2:
    lead-judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 1
      autoAssign: true
      note: Case Role for Auto Assignment - Lead Judge Permissions
    hearing-judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 2
      autoAssign: true
      note: Case Role for Auto Assignment - Hearing Judge Permissions
    judge:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
      note: Judge Permissions
    allocated-tribunal-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 1
      autoAssign: true
      note: Case Role for Auto Assignment - Allocated Tribunal Caseworker
    senior-tribunal-caseworker:
      perms: [ Assign, Unassign, Complete, Cancel ]
      priority: 4
      autoAssign: false
    tribunal-caseworker:
      perms: [ Read, Own, Manage, Claim, Unclaim, UnclaimAssign, CompleteOwn ]
      priority: 3
      autoAssign: false
tasks:
  - id: Et1Vetting
    name: ET1 Vetting
    initialName: Et1 Vetting
    only: [ et_englandwales, et_scotland ]
    workType: routine_work
    roleCategory: ADMIN
    permissions: adminAndCtscWorker
    create:
      - event: SUBMIT_CASE_DRAFT
        postState: Submitted
      - event: initiateCase
        postState: Submitted
      - event: submitEt1Draft
        postState: Submitted
      - event: createEcmCase
        postState: Submitted
    complete:
      - event: preAcceptanceCase
        mode: Auto
    cancelCategory: Vetting
    due:
      days: 5
    priority:
      major: 5000
      minor: 500
      dateOriginRef: dueDate
    link:
      label: ET1 Vetting
      event: et1Vetting
      page: et1Vetting1
    reconfigure: [ workType, roleCategory, dueDateIntervalDays, description ]
  - id: ReviewReferralAdmin
    name: Review Referral - Admin
    initialName: Review Referral
    only: [ et_englandwales, et_scotland ]
    workType: routine_work
    roleCategory: ADMIN
    permissions: adminAndCtscWorker
    create:
      - event: createReferral
        when:
          referCaseTo: Admin
      - event: updateReferral
        when:
          updateReferCaseTo: Admin
        only: [ et_englandwales ]
    complete:
      - event: [ replyToReferral, closeReferral ]
        mode: Auto
    cancelCategory:
      plus:
        - reviewReferralSerialNumberAndSubject_
        - field: CURRENT_REFERRAL_SERIAL_NUMBER
        - " - "
        - field: CURRENT_REFERRAL_SUBJECT
    due:
      days: &a1
        feel: |-
          if (caseData != null
          and caseData.referralCollection != null
          and count(caseData.referralCollection) > 0
          and sort(caseData.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.isUrgent = "Yes")
          then 1
          else 2
    priority:
      major: &a2
        feel: |-
          if (caseData != null
          and caseData.referralCollection != null
          and count(caseData.referralCollection) > 0
          and sort(caseData.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.isUrgent = "Yes")
          then 1000
          else 5000
      minor: &a3
        feel: |-
          if (caseData != null
          and caseData.referralCollection != null
          and count(caseData.referralCollection) > 0
          and sort(caseData.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.isUrgent = "Yes")
          then 100
          else 500
      dateOriginEarliest: dueDate, nextHearingDate
    title:
      if:
        field: LATEST_REVIEW_REFERRAL_TASK_TITLE
        op: exists
      use:
        field: LATEST_REVIEW_REFERRAL_TASK_TITLE
      otherwise:
        if:
          all:
            - field: taskAttributes
              op: exists
            - field: taskAttributes.name
              op: exists
        use:
          field: taskAttributes.name
        otherwise: Review Referral
    link:
      label: Reply to the Referral
      event: replyToReferral
      page: replyToReferral1
    reconfigure: [ workType, roleCategory, description ]
  - id: IssuePostHearingDirection
    name: Issue Post Hearing Direction
    initialName: Issue Post Hearing Direction
    only: [ et_englandwales, et_scotland ]
    workType: hearing_work
    roleCategory: ADMIN
    permissions: adminWorker
    create:
      - event: createReferral
        when:
          referCaseTo: Admin
          referralSubject: Hearings
    complete:
      - event: generateCorrespondence
        mode: Auto
    cancelCategory: Hearing
    due:
      days: 5
    priority:
      major: 5000
      minor: 500
      dateOriginRef: dueDate
    link:
      label: Issue Directions
      event: generateCorrespondence
      page: generateCorrespondence1
    reconfigure: [ workType, roleCategory, dueDateIntervalDays, description ]
  - id: IssueJudgment
    name: Issue Judgment
    initialName: Issue Judgment
    only: [ et_englandwales, et_scotland ]
    workType: hearing_work
    roleCategory: ADMIN
    permissions: adminWorker
    create:
      - event: createReferral
        when:
          referCaseTo: Admin
          referralSubject: Judgment
      - event: draftAndSignJudgement
        when:
          isJudgmentOrOrder: true
    complete:
      - event: addAmendJudgment
        mode: Auto
    cancelCategory: Hearing
    due:
      days: 5
    priority:
      major: &a7
        if:
          all:
            - field: caseData
              op: exists
            - field: caseData.draftAndSignJudgement
              op: exists
            - field: caseData.draftAndSignJudgement.isUrgent
              op: eq
              value: Yes
        use: 1000
        otherwise: 5000
      minor: 500
      dateOriginRef: dueDate
    description: "[View Judgment](/cases/case-details/${[CASE_REFERENCE]}#Judgments) and [Issue Judgment](/cases/case-details/${[CASE_REFERENCE]}/trigger/addAmendJudgment/addAmendJudgment1)"
    reconfigure: [ workType, roleCategory, dueDateIntervalDays, description ]
  - id: ReviewReferralJudiciary
    name: Review Referral - Judicial
    initialName: Review Referral
    only: [ et_englandwales, et_scotland ]
    workType: decision_making_work
    roleCategory: JUDICIAL
    permissions: judicialAndLegalOpsWorker
    create:
      - event: createReferral
        when:
          referCaseTo: Judge
      - event: updateReferral
        when:
          updateReferCaseTo: Judge
        only: [ et_englandwales ]
    complete:
      - event: [ preAcceptanceCase, replyToReferral, closeReferral ]
        mode: Auto
    cancelCategory:
      plus:
        - reviewReferralSerialNumberAndSubject_
        - field: CURRENT_REFERRAL_SERIAL_NUMBER
        - " - "
        - field: CURRENT_REFERRAL_SUBJECT
    due:
      days: *a1
    priority:
      major: *a2
      minor: *a3
      dateOriginEarliest: dueDate, nextHearingDate
    title:
      if:
        field: LATEST_REVIEW_REFERRAL_TASK_TITLE
        op: exists
      use:
        plus:
          - "EJ - "
          - field: LATEST_REVIEW_REFERRAL_TASK_TITLE
      otherwise:
        if:
          all:
            - field: taskAttributes
              op: exists
            - field: taskAttributes.title
              op: exists
        use:
          if:
            truthy:
              call: starts with
              args:
                - field: taskAttributes.title
                - "EJ - "
          use:
            field: taskAttributes.title
          otherwise:
            plus:
              - "EJ - "
              - field: taskAttributes.title
        otherwise: EJ - Review Referral
    link:
      label: Reply to the Referral
      event: replyToReferral
      page: replyToReferral1
    reconfigure: [ workType, roleCategory, title, description ]
  - id: ReviewReferralLegalOps
    name: Review Referral - Legal Ops
    initialName: Review Referral
    only: [ et_englandwales, et_scotland ]
    workType: routine_work
    roleCategory: LEGAL_OPERATIONS
    permissions: judicialAndLegalOpsWorker
    create:
      - event: createReferral
        when:
          referCaseTo: Legal officer
      - event: updateReferral
        when:
          updateReferCaseTo: Legal officer
      - event: updateReferral
        when:
          updateReferCaseTo: Admin
        only: [ et_scotland ]
      - event: updateReferral
        when:
          updateReferCaseTo: Judge
        only: [ et_scotland ]
    complete:
      - event: [ preAcceptanceCase, replyToReferral, closeReferral, updateReferral ]
        mode: Auto
    cancelCategory:
      plus:
        - reviewReferralSerialNumberAndSubject_
        - field: CURRENT_REFERRAL_SERIAL_NUMBER
        - " - "
        - field: CURRENT_REFERRAL_SUBJECT
    due:
      days: *a1
    priority:
      major: *a2
      minor: *a3
      dateOriginEarliest: dueDate, nextHearingDate
    title:
      if:
        field: LATEST_REVIEW_REFERRAL_TASK_TITLE
        op: exists
      use:
        plus:
          - "LO - "
          - field: LATEST_REVIEW_REFERRAL_TASK_TITLE
      otherwise:
        if:
          all:
            - field: taskAttributes
              op: exists
            - field: taskAttributes.title
              op: exists
        use:
          if:
            truthy:
              call: starts with
              args:
                - field: taskAttributes.title
                - "LO - "
          use:
            field: taskAttributes.title
          otherwise:
            plus:
              - "LO - "
              - field: taskAttributes.title
        otherwise: LO - Review Referral
    description: "[Update the Referral](/cases/case-details/${[CASE_REFERENCE]}/trigger/updateReferral/updateReferral1) or [Reply to the Referral](/cases/case-details/${[CASE_REFERENCE]}/trigger/replyToReferral/replyToReferral1)"
    reconfigure: [ workType, roleCategory, title, description ]
  - id: ReviewReferralResponseAdmin
    name: Review Referral Response - Admin
    initialName: Review Referral Response
    only: [ et_englandwales, et_scotland ]
    workType: routine_work
    roleCategory: ADMIN
    permissions: adminAndCtscWorker
    create:
      - event: replyToReferral
        when:
          directionTo: Admin
    complete:
      - event: [ replyToReferral, closeReferral ]
        mode: Auto
    cancelCategory:
      plus:
        - reviewReferralResponseSerialNumberAndSubject_
        - field: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
        - " - "
        - field: CURRENT_REFERRAL_RESPONSE_SUBJECT
    due:
      days: &a4
        feel: |-
          if (caseData!=null
          and caseData.referralCollection != null
          and count(caseData.referralCollection[count(value.referralReplyCollection)>0])>0
          and sort(flatten(caseData.referralCollection.value.referralReplyCollection), function(x,y) date and time(if(x.value.replyDateTime!=null)then x.value.replyDateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.replyDateTime!=null)then y.value.replyDateTime else "2023-01-01T00:00:00.000"))[1].value.isUrgentReply = "Yes")
          then 1
          else 2
    priority:
      major: &a5
        feel: |-
          if (caseData != null
          and caseData.referralCollection != null
          and count(caseData.referralCollection[count(value.referralReplyCollection)>0])>0
          and sort(flatten(caseData.referralCollection.value.referralReplyCollection), function(x,y) date and time(if(x.value.replyDateTime!=null)then x.value.replyDateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.replyDateTime!=null)then y.value.replyDateTime else "2023-01-01T00:00:00.000"))[1].value.isUrgentReply = "Yes")
          then 1000
          else 5000
      minor: &a6
        feel: |-
          if (caseData!=null
          and caseData.referralCollection != null
          and count(caseData.referralCollection[count(value.referralReplyCollection)>0])>0
          and sort(flatten(caseData.referralCollection.value.referralReplyCollection), function(x,y) date and time(if(x.value.replyDateTime!=null)then x.value.replyDateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.replyDateTime!=null)then y.value.replyDateTime else "2023-01-01T00:00:00.000"))[1].value.isUrgentReply = "Yes")
          then 100
          else 500
      dateOriginRef: dueDate
    title:
      if:
        field: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        op: exists
      use:
        field: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
      otherwise:
        if:
          all:
            - field: taskAttributes
              op: exists
            - field: taskAttributes.name
              op: exists
        use:
          field: taskAttributes.name
        otherwise: Review Referral Response
    description: |-
      **Review the Referral Response**

      You can also [Reply to the Referral](/cases/case-details/${[CASE_REFERENCE]}/trigger/replyToReferral/replyToReferral1) or [Close the Referral](/cases/case-details/${[CASE_REFERENCE]}/trigger/closeReferral/closeReferral1)
    reconfigure: [ workType, roleCategory, description ]
  - id: ReviewReferralResponseJudiciary
    name: Review Referral Response - Judicial
    initialName: Review Referral Response
    only: [ et_englandwales, et_scotland ]
    workType: decision_making_work
    roleCategory: JUDICIAL
    permissions: judicialAndLegalOpsWorker
    create:
      - event: replyToReferral
        when:
          directionTo: Judge
    complete:
      - event: [ preAcceptanceCase, replyToReferral, closeReferral ]
        mode: Auto
    cancelCategory:
      plus:
        - reviewReferralResponseSerialNumberAndSubject_
        - field: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
        - " - "
        - field: CURRENT_REFERRAL_RESPONSE_SUBJECT
    due:
      days: *a4
    priority:
      major: *a5
      minor: *a6
      dateOriginRef: dueDate
    title:
      if:
        field: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        op: exists
      use:
        plus:
          - "EJ - "
          - field: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
      otherwise:
        if:
          all:
            - field: taskAttributes
              op: exists
            - field: taskAttributes.title
              op: exists
        use:
          if:
            truthy:
              call: starts with
              args:
                - field: taskAttributes.title
                - "EJ - "
          use:
            field: taskAttributes.title
          otherwise:
            plus:
              - "EJ - "
