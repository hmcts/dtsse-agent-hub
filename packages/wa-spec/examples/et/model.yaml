  configuration:
    name: ET Task configuration DMN
    hitPolicy: COLLECT
    historyTimeToLive: P30D
    overrides:
      et_englandwales_multiple:
        name: ET Multiple Task configuration DMN
      et_scotland_multiple:
        name: ET Multiple Task configuration DMN
    inputs:
      - key: caseData
        label: CCD Case Data
        variable: caseData
        typeRef: string
      - key: taskType
        label: Task type
        variable: taskType
        typeRef: string
        expression:
          if:
            all:
              - field: taskAttributes
                op: exists
              - field: taskAttributes.taskType
                op: exists
          use:
            field: taskAttributes.taskType
          otherwise:
            if:
              field: taskType
              op: exists
            use:
              field: taskType
            otherwise: null
    outputs:
      - name: name
        label: Name
        typeRef: string
      - name: value
        label: Value
        typeRef: string
      - name: canReconfigure
        label: Can Reconfigure?
        typeRef: boolean
    rows: []
    helpers:
      - name: LATEST_REVIEW_REFERRAL_TASK_TITLE
        typeRef: string
        expression:
          if:
            field: reviewReferralSerialNumberAndSubject
            op: exists
          use:
            plus:
              - "Review Referral #"
              - field: reviewReferralSerialNumberAndSubject
          otherwise: null
        only: [ et_englandwales, et_scotland ]
      - name: reviewReferralSerialNumberAndSubject
        typeRef: string
        expression:
          feel: |-
            {
              "__prefix" : "__processCategory__reviewReferralSerialNumberAndSubject_",
              "__attribute_entries" : get entries(taskAttributes),
              "__matching_keys" : for __item in __attribute_entries return if starts with(__item.key, __prefix) then substring(__item.key, string length(__prefix) + 1) else null,
              "__filtered_keys" : __matching_keys[item != null],
              "__nonempty_keys" : append(__filtered_keys, null),
              "__nullable_review_referral_serial_number_and_subject" : __nonempty_keys[1]
            }.__nullable_review_referral_serial_number_and_subject
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        expression:
          if:
            field: referralReviewResponseSerialNumberAndSubject
            op: exists
          use:
            plus:
              - "Review Referral Response #"
              - field: referralReviewResponseSerialNumberAndSubject
          otherwise: null
        only: [ et_englandwales ]
      - name: referralReviewResponseSerialNumberAndSubject
        typeRef: string
        expression:
          feel: |-
            {
              "__prefix" : "__processCategory__reviewReferralResponseSerialNumberAndSubject_",
              "__attribute_entries" : get entries(taskAttributes),
              "__matching_keys" : for __item in __attribute_entries return if starts with(__item.key, __prefix) then substring(__item.key, string length(__prefix) + 1) else null,
              "__filtered_keys" : __matching_keys[item != null],
              "__nonempty_keys" : append(__filtered_keys, null),
              "__nullable_review_referral_response_serial_number_and_subject" : __nonempty_keys[1]
            }.__nullable_review_referral_response_serial_number_and_subject
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        typeRef: string
        expression:
          if:
            field: referralReviewResponseSerialNumberAndSubject
            op: exists
          use:
            plus:
              - "Review Referral Response #"
              - field: referralReviewResponseSerialNumberAndSubject
          otherwise: null
        only: [ et_scotland ]
    dependencies:
      - decision: table
        requires: LATEST_REVIEW_REFERRAL_TASK_TITLE
        only: [ et_englandwales, et_scotland ]
      - decision: table
        requires: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        only: [ et_englandwales, et_scotland ]
      - decision: LATEST_REVIEW_REFERRAL_TASK_TITLE
        requires: reviewReferralSerialNumberAndSubject
        only: [ et_englandwales, et_scotland ]
      - decision: LATEST_REVIEW_REFERRAL_RESPONSE_TASK_TITLE
        requires: referralReviewResponseSerialNumberAndSubject
        only: [ et_englandwales, et_scotland ]
  permissions:
