                and count(additionalData.Data.referralCollection) > 0
                and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject!=null)
                then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.referralSubject
