    name: Draft And Sign Judgment/Order
    initialName: Draft And Sign Judgment/Order
    only: [ et_englandwales, et_scotland ]
    workType: decision_making_work
    roleCategory: JUDICIAL
    permissions: judicialAndLegalOpsWorker
    create:
      - event: updateHearing
        postState: Accepted
        when:
          hearingsHeard: true
    complete:
      - event: draftAndSignJudgement
        mode: Auto
    cancelCategory: Judgment
    due:
      days:
        if:
          left:
            call: month
            args:
              - field: dueDateOrigin
          op: eq
          right: 2
        use: 18
        otherwise:
          if:
            any:
              - left:
                  call: month
                  args:
                    - field: dueDateOrigin
                op: eq
                right: 4
              - left:
                  call: month
                  args:
                    - field: dueDateOrigin
                op: eq
                right: 6
              - left:
                  call: month
                  args:
                    - field: dueDateOrigin
                op: eq
                right: 9
              - left:
                  call: month
                  args:
                    - field: dueDateOrigin
                op: eq
                right: 11
          use: 19
          otherwise: 20
      origin:
        feel: |-
          if (caseData != null
          and caseData.hearingDetailsCollection != null
          and count(caseData.hearingDetailsCollection) = 1)
          then date and time(caseData.hearingDetailsCollection[1].value.hearingDetailsDate)
          else if caseData.hearingDetailsCollection != null and count(caseData.hearingDetailsCollection) > 1
          then max(
          flatten(
            [ for h in caseData.hearingDetailsCollection return
             date and time(h.value.hearingDetailsDate) ]
            )
          )
          else now()
      skipNonWorkingDays: "false"
      nonWorkingDaysOfWeek: "false"
