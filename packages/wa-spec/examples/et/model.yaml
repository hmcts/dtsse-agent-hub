                number(x.value.referralNumber)
                >
                number(y.value.referralNumber)
            )[1].value.referralNumber
            else ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0)
            then (
              if(sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject = "Other")
              then (
                if(sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubjectSpecify != null)
                then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubjectSpecify
                else "Other"
              )
              else sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject
            )
            else ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[value.referralReplyCollection != null and count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null and count(value.referralReplyCollection) > 0].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "0001-01-01T00:00:00")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "0001-01-01T00:00:00")
              )[1].value.referralNumber
            )
            else ""
