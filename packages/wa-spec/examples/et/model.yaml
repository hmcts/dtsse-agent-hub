      - name: CURRENT_REFERRAL_RESPONSE_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData != null and additionalData.Data != null and additionalData.Data.referralCollection != null and count(additionalData.Data.referralCollection[value.referralReplyCollection != null and count(value.referralReplyCollection) > 0]) > 0)
            then
              if(
                (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubject) = "Other"
              )
              then
                if(
                  (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubjectSpecify) != null
                )
                then
                  (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubjectSpecify)
                else
                  "Other"
              else
                (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubject)
            else
