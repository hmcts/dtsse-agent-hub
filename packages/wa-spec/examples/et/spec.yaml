  configuration:
    name: ET Task configuration DMN
    hitPolicy: COLLECT
    historyTimeToLive: P30D
    overrides:
      et_englandwales_multiple:
        name: ET Multiple Task configuration DMN
      et_scotland_multiple:
        name: ET Multiple Task configuration DMN
    inputs:
      - key: caseData
        label: CCD Case Data
        variable: caseData
        typeRef: string
      - key: taskType
        label: Task type
        variable: taskType
        typeRef: string
        expression:
          if:
            all:
              - field: taskAttributes
                op: exists
              - field: taskAttributes.taskType
                op: exists
          use:
            field: taskAttributes.taskType
          otherwise:
            if:
              field: taskType
              op: exists
            use:
              field: taskType
            otherwise: null
    outputs:
      - name: name
        label: Name
        typeRef: string
      - name: value
        label: Value
        typeRef: string
      - name: canReconfigure
        label: Can Reconfigure?
        typeRef: boolean
    rows:
      - description: 1v1 scenario - Concatenates Claimant's forename name with that of respondent to create the case name displayed on task lists
        only: [ et_englandwales, et_scotland ]
        returns:
          name: caseName
          value:
            plus:
              - if:
                  field: caseData.ethosCaseReference
                  op: exists
                use:
                  plus:
                    - field: caseData.ethosCaseReference
                    - " - "
                otherwise: ""
              - if:
                  field: caseData.claimant
                  op: exists
                use:
                  field: caseData.claimant
                otherwise: Unknown
              - " v "
              - if:
                  field: caseData.respondent
                  op: exists
                use:
                  field: caseData.respondent
                otherwise: Unknown
          canReconfigure: true
      - only: [ et_englandwales_multiple, et_scotland_multiple ]
        returns:
          name: caseName
          value:
            field: caseData.multipleName
          canReconfigure: true
      - only: [ et_englandwales, et_englandwales_multiple ]
        returns:
          name: region
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.region
                  op: exists
            use:
              field: caseData.caseManagementLocation.region
            otherwise: "1"
          canReconfigure: true
      - only: [ et_englandwales ]
        returns:
          name: location
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.baseLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.baseLocation
            otherwise: "369230"
          canReconfigure: true
      - only: [ et_englandwales_multiple ]
        returns:
          name: location
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.baseLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.baseLocation
            otherwise: "21153"
          canReconfigure: true
      - only: [ et_englandwales, et_englandwales_multiple ]
        returns:
          name: locationName
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.baseLocation
                  op: exists
                - field: caseData.managingOffice
                  op: exists
            use:
              field: caseData.managingOffice
            otherwise: London Central
          canReconfigure: true
      - only: [ et_scotland, et_scotland_multiple ]
        returns:
          name: region
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.region
                  op: exists
            use:
              field: caseData.caseManagementLocation.region
            otherwise: "11"
          canReconfigure: true
      - only: [ et_scotland, et_scotland_multiple ]
        returns:
          name: location
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.baseLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.baseLocation
            otherwise: "368308"
          canReconfigure: true
      - only: [ et_scotland, et_scotland_multiple ]
        returns:
          name: locationName
          value:
            if:
              all:
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.baseLocation
                  op: exists
                - field: caseData.managingOffice
                  op: exists
            use:
              field: caseData.managingOffice
            otherwise: Edinburgh
          canReconfigure: true
      - description: Sets the case category that is displayed in the task list UI
        only: [ et_englandwales, et_scotland ]
        returns:
          name: caseManagementCategory
          value:
            if:
              all:
                - field: caseData.caseManagementCategory
                  op: exists
                - field: caseData.caseManagementCategory.selectedLabel
                  op: exists
            use:
              field: caseData.caseManagementCategory.selectedLabel
            otherwise: Employment
          canReconfigure: false
      - description: Sets the case category that is displayed in the task list UI
        only: [ et_englandwales_multiple, et_scotland_multiple ]
        returns:
          name: caseManagementCategory
          value: Employment
          canReconfigure: false
      - description: Use nextListedDate until onboarded to HMC
        returns:
          name: nextHearingDate
          value:
            if:
              field: caseData.nextListedDate
              op: exists
            use:
              field: caseData.nextListedDate
            otherwise: ""
          canReconfigure: true
      - description: Name of the type of work - this is based on the filter. All Judgment tasks will be decision making work.
        only: [ et_englandwales, et_scotland ]
        when:
          taskType:
            in:
              - Et1Vetting
              - ReviewReferralAdmin
              - ReviewReferralLegalOps
              - SendEt1Notification
              - ListServeClaim
              - Rule21
              - ET3Processing
              - ReviewReferralResponseLegalOps
              - ReviewReferralResponseAdmin
              - IssueInitialConsiderationDirections
              - ListAHearing
              - ReviewRule21Referral
              - SendEt3Notification
              - ReviewECCResponse
              - ExpiredBfAction
              - ReferEmployersContractClaim
        returns:
          name: workType
          value: routine_work
          canReconfigure: true
      - only: [ et_englandwales, et_scotland ]
