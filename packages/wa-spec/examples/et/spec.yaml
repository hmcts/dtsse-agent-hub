    helpers:
      - name: LATEST_APPLICATION_TASK_NAME
        typeRef: string
        historyTimeToLive: P30D
        expression:
          if:
            field: LATEST_APPLICATION_TYPE
            op: exists
          use:
            if:
              any:
                - field: LATEST_APPLICATION_TYPE
                  op: eq
                  value: Contact about something else
                - field: LATEST_APPLICATION_TYPE
                  op: eq
                  value: Contact the tribunal
            use: Contact the tribunal
            otherwise:
              plus:
                - "Review Application - "
                - field: LATEST_APPLICATION_TYPE
          otherwise: null
        only: [ et_englandwales, et_scotland ]
        overrides:
          et_scotland:
            historyTimeToLive: null
      - name: LATEST_APPLICATION_TYPE
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.genericTseApplicationCollection!=null
            and count(additionalData.Data.genericTseApplicationCollection) > 0)
            then sort(
              additionalData.Data.genericTseApplicationCollection,
              function(x,y)
                number(x.value.number)
                >
                number(y.value.number)
            ).value.type[1]
            else null
        only: [ et_englandwales, et_scotland ]
        overrides:
          et_scotland:
            expression:
              feel: |-
                if(additionalData!=null
                and additionalData.Data!=null
                and additionalData.Data.genericTseApplicationCollection!=null
                and count(additionalData.Data.genericTseApplicationCollection) > 0)
                then sort(additionalData.Data.genericTseApplicationCollection,function(x,y) number(x.value.number) > number(y.value.number)).value.type[1]
                else null
      - name: LATEST_APPLICATION_RESPOND_TASK_NAME
        typeRef: string
        expression:
          if:
            field: LATEST_APPLICATION_RESPOND_TYPE
            op: exists
          use:
            if:
              any:
                - field: LATEST_APPLICATION_RESPOND_TYPE
                  op: eq
                  value: Contact about something else
                - field: LATEST_APPLICATION_RESPOND_TYPE
                  op: eq
                  value: Contact the tribunal
            use: Contact the tribunal Response
            otherwise:
              plus:
                - "Review Application Response - "
                - field: LATEST_APPLICATION_RESPOND_TYPE
          otherwise: null
        only: [ et_englandwales ]
      - name: LATEST_APPLICATION_RESPOND_TYPE
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.genericTseApplicationCollection!=null
            and count(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null])>0)
            then sort(
              flatten(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null].value.respondCollection),
              function(x,y)
                date and time(if(x.value.dateTime!=null)then x.value.dateTime else "2023-01-01T00:00:00.000")
                >
                date and time(if(y.value.dateTime!=null)then y.value.dateTime else "2023-01-01T00:00:00.000")
            )[1].value.applicationType
            else null
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_APPLICATION_RESPOND_TASK_NAME
        typeRef: string
        expression:
          if:
            field: LATEST_APPLICATION_RESPOND_TYPE
            op: exists
          use:
            if:
              any:
                - field: LATEST_APPLICATION_RESPOND_TYPE
                  op: eq
                  value: Contact about something else
                - field: LATEST_APPLICATION_RESPOND_TYPE
                  op: eq
                  value: Contact the tribunal
            use: Contact the tribunal Response
            otherwise:
              plus:
                - "Review Application Response - "
                - field: LATEST_APPLICATION_RESPOND_TYPE
          otherwise: null
        only: [ et_scotland ]
      - name: LATEST_NOTIFICATION_RESPONSE_IS_ECC_FROM_CLAIMANT
        typeRef: boolean
        expression:
          feel: (LATEST_NOTIFICATION_RESPONSE_IS_ECC and LATEST_NOTIFICATION_RESPONSE_IS_FROM_CLAIMANT)
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_NOTIFICATION_RESPONSE_IS_ECC
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.sendNotificationCollection!=null
            and count(additionalData.Data.sendNotificationCollection[number(value.sendNotificationResponsesCount)>0])>0)

            then (sort(
            flatten(additionalData.Data.sendNotificationCollection[number(value.sendNotificationResponsesCount)>0].value.respondCollection),
            function(x,y)
            date and time(if(x.value.dateTime!=null)then x.value.dateTime else "2023-01-01T00:00:00.000")
            >
            date and time(if(y.value.dateTime!=null)then y.value.dateTime else "2023-01-01T00:00:00.000")
            )[1].value.isECC="Yes")

            else false
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_NOTIFICATION_RESPONSE_IS_FROM_CLAIMANT
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.sendNotificationCollection!=null
            and count(additionalData.Data.sendNotificationCollection[number(value.sendNotificationResponsesCount)>0])>0)

            then (sort(
            flatten(additionalData.Data.sendNotificationCollection[number(value.sendNotificationResponsesCount)>0].value.respondCollection),
            function(x,y)
            date and time(if(x.value.dateTime!=null)then x.value.dateTime else "2023-01-01T00:00:00.000")
            >
            date and time(if(y.value.dateTime!=null)then y.value.dateTime else "2023-01-01T00:00:00.000")
            )[1].value.from="Claimant")

            else false
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_SERIAL_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0
            and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralNumber!=null)
            then sort(
              additionalData.Data.referralCollection,
              function(x,y)
                number(x.value.referralNumber)
                >
                number(y.value.referralNumber)
            )[1].value.referralNumber
            else ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0)
            then (
              if(sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject = "Other")
              then (
                if(sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubjectSpecify != null)
                then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubjectSpecify
                else "Other"
              )
              else sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject
            )
            else ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[value.referralReplyCollection != null and count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null and count(value.referralReplyCollection) > 0].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "0001-01-01T00:00:00")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "0001-01-01T00:00:00")
              )[1].value.referralNumber
            )
            else ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_REFERRAL_RESPONSE_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData != null and additionalData.Data != null and additionalData.Data.referralCollection != null and count(additionalData.Data.referralCollection[value.referralReplyCollection != null and count(value.referralReplyCollection) > 0]) > 0)
            then
              if(
                (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubject) = "Other"
              )
              then
                if(
                  (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubjectSpecify) != null
                )
                then
                  (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubjectSpecify)
                else
                  "Other"
              else
                (additionalData.Data.referralCollection[value.referralNumber = sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection != null].value.referralReplyCollection), function(x, y) date and time(x.value.replyDateTime) > date and time(y.value.replyDateTime))[1].value.referralNumber][1].value.referralSubject)
            else
              ""
        only: [ et_englandwales, et_scotland ]
      - name: CURRENT_NOTIFICATION_NAME
        typeRef: string
        expression:
          feel: |-
            if additionalData != null
              and additionalData.Data != null
              and additionalData.Data.sendNotificationCollection != null
              and count(additionalData.Data.sendNotificationCollection[number(value.sendNotificationResponsesCount) > 0]) > 0
            then (for r in [sort(
                for i in 1..count(additionalData.Data.sendNotificationCollection)
                return {
                  position: i,
                  latestDateTime: if(additionalData.Data.sendNotificationCollection[i].value.respondCollection != null
                                    and count(additionalData.Data.sendNotificationCollection[i].value.respondCollection) > 0)
                                  then sort(
                                      additionalData.Data.sendNotificationCollection[i].value.respondCollection,
                                      function(a, b)
                                        date and time(if(a.value.dateTime != null) then a.value.dateTime else "2023-01-01T00:00:00.000") >
                                        date and time(if(b.value.dateTime != null) then b.value.dateTime else "2023-01-01T00:00:00.000")
                                    )[1].value.dateTime
                                  else "2023-01-01T00:00:00.000"
                },
                function(x, y)
                  date and time(if(x.latestDateTime != null) then x.latestDateTime else "2023-01-01T00:00:00.000") >
                  date and time(if(y.latestDateTime != null) then y.latestDateTime else "2023-01-01T00:00:00.000")
              )[1]]
              return if r != null and r.position != null
                     then "Review notification " + string(r.position) + " response"
                     else "Review notification response"
            )[1]
            else "Review notification response"
        only: [ et_englandwales, et_scotland ]
      - name: ARRANGE_SUPPORT_TASK_NAME
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.supportTaskState
                op: exists
          use:
            field: additionalData.Data.supportTaskState.arrangeSupportTaskName
          otherwise: null
        only: [ et_englandwales, et_scotland ]
      - name: LATEST_REFERRAL_REPLY_TASK_NAME
        typeRef: string
        historyTimeToLive: P30D
        expression:
          if:
            all:
              - field: LATEST_REFERRAL_REPLY_NUMBER
                op: exists
              - field: LATEST_REFERRAL_REPLY_SUBJECT
                op: exists
          use:
            plus:
              - "Review Multiples Referral #"
              - field: LATEST_REFERRAL_REPLY_NUMBER
              - " - "
              - field: LATEST_REFERRAL_REPLY_SUBJECT
              - " Response"
          otherwise: null
        only: [ et_englandwales_multiple ]
      - name: LATEST_REFERRAL_TASK_NAME
        typeRef: string
        historyTimeToLive: P30D
        expression:
          if:
            all:
              - field: LATEST_REFERRAL_NUMBER
                op: exists
              - field: LATEST_REFERRAL_SUBJECT
                op: exists
          use:
            plus:
              - "Review Multiples Referral #"
              - field: LATEST_REFERRAL_NUMBER
              - " - "
              - field: LATEST_REFERRAL_SUBJECT
          otherwise: null
        only: [ et_englandwales_multiple, et_scotland_multiple ]
        overrides:
          et_scotland_multiple:
            expression:
              feel: |-
                if(additionalData!=null
                and additionalData.Data!=null
                and additionalData.Data.referralCollection!=null
                and count(additionalData.Data.referralCollection) > 0)
                then "Review Multiples Referral #" + LATEST_REFERRAL_NUMBER + " - " + LATEST_REFERRAL_SUBJECT
                else null
      - name: LATEST_REFERRAL_REPLY_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "2023-01-01T00:00:00.000")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "2023-01-01T00:00:00.000")
              )[1].value.referralNumber
            )
            else null
        only: [ et_englandwales_multiple ]
      - name: LATEST_REFERRAL_REPLY_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "2023-01-01T00:00:00.000")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "2023-01-01T00:00:00.000")
              )[1].value.referralSubject
            )
            else null
        only: [ et_englandwales_multiple ]
      - name: LATEST_REFERRAL_REPLY_TASK_NAME
        typeRef: string
        historyTimeToLive: P30D
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then "Review Multiples Referral #" + LATEST_REFERRAL_REPLY_NUMBER + " - " + LATEST_REFERRAL_REPLY_SUBJECT + " Response"
            else null
        only: [ et_scotland_multiple ]
      - name: LATEST_REFERRAL_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0
            and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralNumber!=null)
            then sort(
              additionalData.Data.referralCollection,
              function(x,y)
                number(x.value.referralNumber)
                >
                number(y.value.referralNumber)
            )[1].value.referralNumber
            else null
        only: [ et_englandwales_multiple, et_scotland_multiple ]
        overrides:
          et_scotland_multiple:
            expression:
              feel: |-
                if(additionalData!=null
                and additionalData.Data!=null
                and additionalData.Data.referralCollection!=null
                and count(additionalData.Data.referralCollection) > 0
                and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralNumber!=null)
                then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.referralNumber
                else null
      - name: LATEST_REFERRAL_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0
            and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject!=null)
            then sort(
              additionalData.Data.referralCollection,
              function(x,y)
                number(x.value.referralNumber)
                >
                number(y.value.referralNumber)
            )[1].value.referralSubject
            else null
        only: [ et_englandwales_multiple, et_scotland_multiple ]
        overrides:
          et_scotland_multiple:
            expression:
              feel: |-
                if(additionalData!=null
                and additionalData.Data!=null
                and additionalData.Data.referralCollection!=null
                and count(additionalData.Data.referralCollection) > 0
                and sort(additionalData.Data.referralCollection,function(x,y) number(x.value.referralNumber)>number(y.value.referralNumber))[1].value.referralSubject!=null)
                then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber))[1].value.referralSubject
                else null
      - name: LATEST_REFERRAL_REPLY_NUMBER
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "2023-01-01T00:00:00.000")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "2023-01-01T00:00:00.000")
                )[1].value.referralNumber
            )
            else null
        only: [ et_scotland_multiple ]
      - name: LATEST_REFERRAL_REPLY_SUBJECT
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then (
              sort(
                flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null].value.referralReplyCollection),
                function(x,y)
                  date and time(if(x.value.replyDateTime!=null) then x.value.replyDateTime else "2023-01-01T00:00:00.000")
                  >
                  date and time(if(y.value.replyDateTime!=null) then y.value.replyDateTime else "2023-01-01T00:00:00.000")
              )[1].value.referralSubject
            )
            else null
        only: [ et_scotland_multiple ]
    dependencies:
      - decision: table
        requires: LATEST_APPLICATION_TASK_NAME
