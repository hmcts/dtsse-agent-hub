version: 1
service:
  slug: employment
  jurisdiction: EMPLOYMENT
  serviceCode: BHA1
  displayName: Employment
caseTypes:
  - id: et_englandwales
  - id: et_englandwales_multiple
  - id: et_scotland
  - id: et_scotland_multiple
decisions:
  initiation:
    name: ET Task initiation DMN
    hitPolicy: COLLECT
    historyTimeToLive: P30D
    overrides:
      et_englandwales_multiple:
        name: ET Multiple Task initiation DMN
      et_scotland_multiple:
        name: ET Multiple Task initiation DMN
    inputs:
      - key: eventId
        label: Event Id
        variable: eventId
        typeRef: string
      - key: postEventState
        label: Post event state
        variable: postEventState
        typeRef: string
      - key: referCaseTo
        label: Refer Case To
        variable: referCaseTo
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0)
            then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber)).value.referCaseTo[1]
            else null
      - key: referralSubject
        label: Referral Subject
        variable: referralSubject
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection) > 0)
            then sort(additionalData.Data.referralCollection, function(x,y) number(x.value.referralNumber) > number(y.value.referralNumber)).value.referralSubject[1]
            else null
      - key: updateReferCaseTo
        label: Update Directed To
        variable: updateReferCaseTo
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.updateReferralCollection)>0])>0)
            then sort(flatten(additionalData.Data.referralCollection[value.updateReferralCollection!=null].value.updateReferralCollection), function(x,y) date and time(if(x.value.updateReferralDateTime!=null)then x.value.updateReferralDateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.updateReferralDateTime!=null)then y.value.updateReferralDateTime else "2023-01-01T00:00:00.000")).value.updateReferCaseTo[1]
            else null
        only: [ et_englandwales, et_scotland ]
      - key: directionTo
        label: Direction To
        variable: directionTo
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.referralCollection!=null
            and count(additionalData.Data.referralCollection[count(value.referralReplyCollection)>0])>0)
            then sort(flatten(additionalData.Data.referralCollection[value.referralReplyCollection!=null].value.referralReplyCollection), function(x,y) date and time(if(x.value.replyDateTime!=null)then x.value.replyDateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.replyDateTime!=null)then y.value.replyDateTime else "2023-01-01T00:00:00.000")).value.directionTo[1]
            else null
      - key: et3FormReceived
        label: ET3 form received
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.respondentCollection!=null
            and count(additionalData.Data.respondentCollection)>0)
            then
              if(additionalData.Data.respondentCollection[1].value.responseReceived)
              then
                if(additionalData.Data.respondentCollection[1].value.responseReceivedCount="1")
                then true
                else false
              else false
            else false
        only: [ et_englandwales, et_scotland ]
      - key: isThereAnEt3Response
        label: Is There An Et3 Response
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.respondentCollection!=null
            and count(additionalData.Data.respondentCollection) > 0)
            then some item in additionalData.Data.respondentCollection satisfies (item.value.et3Vetting != null and item.value.et3Vetting.et3IsThereAnEt3Response = true)
            else false
        only: [ et_englandwales, et_scotland ]
      - key: isECC
        label: Is ECC
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.respondentCollection!=null
            and count(additionalData.Data.respondentCollection) > 0)
            then some item in additionalData.Data.respondentCollection satisfies (item.value.et3Vetting != null and item.value.et3Vetting.et3ContractClaimSection7 = true)
            else false
        only: [ et_englandwales, et_scotland ]
      - key: isECCReplyReceived
        label: Is ECC Reply Received
        typeRef: boolean
        expression:
          feel: |-
            if (
              additionalData != null
              and additionalData.Data != null
              and additionalData.Data.respondentCollection != null
              and count(additionalData.Data.respondentCollection) > 0
            )
            then
              some item in additionalData.Data.respondentCollection satisfies (
                item.value.respondentEccReplyCount = "1"
              )
            else false
        only: [ et_englandwales, et_scotland ]
      - key: respondentECCReply
        label: Respondent ECC Reply
        typeRef: boolean
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.respondentCollection!=null
            and count(additionalData.Data.respondentCollection) > 0
            and additionalData.Data.respondentCollection[1].value.et3Vetting!=null)
            then additionalData.Data.respondentCollection[1].value.et3Vetting.et3ResponseEccYes
            else null
        only: [ et_englandwales, et_scotland ]
      - key: listAHearing
        label: List A Hearing
        typeRef: boolean
        language: feel
        expression:
          feel: |-
            if(additionalData.Data.etICHearingNotListedListUpdated!=null
            and count(additionalData.Data.etICHearingNotListedListUpdated) > 0
            and (list contains(additionalData.Data.etICHearingNotListedListUpdated, "List for preliminary hearing")
            or list contains(additionalData.Data.etICHearingNotListedListUpdated, "List for final hearing")))
            then true
            else false
        only: [ et_englandwales, et_scotland ]
        overrides:
          et_scotland:
            language: null
      - key: strikeOutClaimStrikeOutResponse
        label: Strike Out Claim/Strike Out Response
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.etInitialConsiderationRule27
                op: exists
              - field: additionalData.Data.etInitialConsiderationRule27.etICRule27ClaimToBe
                op: exists
          use:
            field: additionalData.Data.etInitialConsiderationRule27.etICRule27ClaimToBe
          otherwise:
            if:
              all:
                - field: additionalData
                  op: exists
                - field: additionalData.Data
                  op: exists
                - field: additionalData.Data.etInitialConsiderationRule28
                  op: exists
                - field: additionalData.Data.etInitialConsiderationRule28.etICRule28ClaimToBe
                  op: exists
            use:
              field: additionalData.Data.etInitialConsiderationRule28.etICRule28ClaimToBe
            otherwise: null
        only: [ et_scotland ]
      - key: hearingsHeard
        label: Hearings Heard
        typeRef: boolean
        expression:
          feel: |-
            additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.hearingDetailsCollection!=null
            and count(additionalData.Data.hearingDetailsCollection)>0
            and (some x in additionalData.Data.hearingDetailsCollection satisfies x.value.hearingDetailsStatus="Heard")
            and (every x in additionalData.Data.hearingDetailsCollection satisfies (x.value.hearingDetailsStatus="Heard" or x.value.hearingDetailsStatus="Vacated" or x.value.hearingDetailsStatus="Postponed"))
        only: [ et_englandwales, et_scotland ]
      - key: submissionReasonApplication
        label: Submission Reason (Application)
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.genericTseApplicationCollection!=null
            and count(additionalData.Data.genericTseApplicationCollection) > 0)
            then sort(additionalData.Data.genericTseApplicationCollection,function(x,y) number(x.value.number) > number(y.value.number)).value.type[1]
            else null
        only: [ et_englandwales, et_scotland ]
      - key: applicationResponseFrom
        label: Application Response From
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.genericTseApplicationCollection!=null
            and count(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null])>0)
            then sort(flatten(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null].value.respondCollection), function(x,y) date and time(if(x.value.dateTime!=null)then x.value.dateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.dateTime!=null)then y.value.dateTime else "2023-01-01T00:00:00.000"))[1].value.from
            else null
        only: [ et_englandwales, et_scotland ]
      - key: responseToApplicationType
        label: Response to Application Type
        typeRef: string
        expression:
          feel: |-
            if(additionalData!=null
            and additionalData.Data!=null
            and additionalData.Data.genericTseApplicationCollection!=null
            and count(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null])>0)
            then sort(flatten(additionalData.Data.genericTseApplicationCollection[value.respondCollection!=null].value.respondCollection), function(x,y) date and time(if(x.value.dateTime!=null)then x.value.dateTime else "2023-01-01T00:00:00.000") > date and time(if(y.value.dateTime!=null)then y.value.dateTime else "2023-01-01T00:00:00.000"))[1].value.applicationType
            else null
        only: [ et_englandwales, et_scotland ]
      - key: notificationResponseIsECCFromClaimant
        label: Notification Response is ECC from Claimant
        typeRef: boolean
        expression:
          field: LATEST_NOTIFICATION_RESPONSE_IS_ECC_FROM_CLAIMANT
        only: [ et_englandwales, et_scotland ]
      - key: isJudgmentOrOrder
        label: Is Judgment Or Order
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.draftAndSignJudgement
                op: exists
              - field: additionalData.Data.draftAndSignJudgement.isJudgement
                op: exists
          use:
            field: additionalData.Data.draftAndSignJudgement.isJudgement
          otherwise: false
        only: [ et_englandwales, et_scotland ]
      - key: adminSupportTaskRequired
        label: Admin Support Task Required
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.supportTaskState
                op: exists
              - field: additionalData.Data.supportTaskState.adminTaskRequired
                op: exists
          use:
            field: additionalData.Data.supportTaskState.adminTaskRequired
            op: eq
            value: true
          otherwise: false
        only: [ et_englandwales, et_scotland ]
      - key: legalOfficerSupportTaskRequired
        label: Legal Officer Support Task Required
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.supportTaskState
                op: exists
              - field: additionalData.Data.supportTaskState.legalOfficerTaskRequired
                op: exists
          use:
            field: additionalData.Data.supportTaskState.legalOfficerTaskRequired
            op: eq
            value: true
          otherwise: false
        only: [ et_englandwales, et_scotland ]
      - key: judgeSupportTaskRequired
        label: Judge Support Task Required
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.supportTaskState
                op: exists
              - field: additionalData.Data.supportTaskState.judgeTaskRequired
                op: exists
          use:
            field: additionalData.Data.supportTaskState.judgeTaskRequired
            op: eq
            value: true
          otherwise: false
        only: [ et_englandwales, et_scotland ]
      - key: arrangeSupportTaskRequired
        label: Arrange Support Task Required
        typeRef: boolean
        expression:
          field: ARRANGE_SUPPORT_TASK_NAME
          op: exists
        only: [ et_englandwales, et_scotland ]
    outputs:
      - name: taskId
        label: Task Id
        typeRef: string
      - name: name
        label: Name
        typeRef: string
      - name: delayDuration
        label: Delay Duration
        typeRef: integer
      - name: processCategories
        label: Process Categories Identifiers
        typeRef: string
    rows:
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ SUBMIT_CASE_DRAFT ]
          postEventState:
            in: [ Submitted ]
        returns:
          taskId: Et1Vetting
          name: Et1 Vetting
          processCategories: Vetting
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ initiateCase ]
          postEventState:
            in: [ Submitted ]
        returns:
          taskId: Et1Vetting
          name: Et1 Vetting
          processCategories: Vetting
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ createReferral ]
          referCaseTo:
            in: [ Admin ]
        returns:
          taskId: ReviewReferralAdmin
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ createReferral ]
          referCaseTo:
            in: [ Admin ]
          referralSubject:
            in: [ Hearings ]
        returns:
          taskId: IssuePostHearingDirection
          name: Issue Post Hearing Direction
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ createReferral ]
          referCaseTo:
            in: [ Admin ]
          referralSubject:
            in: [ Judgment ]
        returns:
          taskId: IssueJudgment
          name: Issue Judgment
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ createReferral ]
          referCaseTo:
            in: [ Judge ]
        returns:
          taskId: ReviewReferralJudiciary
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ createReferral ]
          referCaseTo:
            in: [ Legal officer ]
        returns:
          taskId: ReviewReferralLegalOps
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ replyToReferral ]
          directionTo:
            in: [ Admin ]
        returns:
          taskId: ReviewReferralResponseAdmin
          name: Review Referral Response
          processCategories:
            plus:
              - reviewReferralResponseSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_RESPONSE_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ replyToReferral ]
          directionTo:
            in: [ Judge ]
        returns:
          taskId: ReviewReferralResponseJudiciary
          name: Review Referral Response
          processCategories:
            plus:
              - reviewReferralResponseSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_RESPONSE_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ replyToReferral ]
          directionTo:
            in: [ Legal officer ]
        returns:
          taskId: ReviewReferralResponseLegalOps
          name: Review Referral Response
          processCategories:
            plus:
              - reviewReferralResponseSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_RESPONSE_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_RESPONSE_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ updateReferral ]
          updateReferCaseTo:
            in: [ Legal officer ]
        returns:
          taskId: ReviewReferralLegalOps
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales ]
        when:
          eventId:
            in: [ updateReferral ]
          updateReferCaseTo:
            in: [ Admin ]
        returns:
          taskId: ReviewReferralAdmin
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales ]
        when:
          eventId:
            in: [ updateReferral ]
          updateReferCaseTo:
            in: [ Judge ]
        returns:
          taskId: ReviewReferralJudiciary
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_scotland ]
        when:
          eventId:
            in: [ updateReferral ]
          updateReferCaseTo:
            in: [ Admin ]
        returns:
          taskId: ReviewReferralLegalOps
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_scotland ]
        when:
          eventId:
            in: [ updateReferral ]
          updateReferCaseTo:
            in: [ Judge ]
        returns:
          taskId: ReviewReferralLegalOps
          name: Review Referral
          processCategories:
            plus:
              - reviewReferralSerialNumberAndSubject_
              - field: CURRENT_REFERRAL_SERIAL_NUMBER
              - " - "
              - field: CURRENT_REFERRAL_SUBJECT
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ draftAndSignJudgement ]
          isJudgmentOrOrder:
            in: [ true ]
        returns:
          taskId: IssueJudgment
          name: Issue Judgment
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ draftAndSignJudgement ]
          isJudgmentOrOrder:
            in: [ false ]
        returns:
          taskId: IssueOrder
          name: Issue Order
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ preAcceptanceCase ]
          postEventState:
            in: [ Accepted ]
        returns:
          taskId: ListServeClaim
          name: List/ Serve Claim
          processCategories: Vetting
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ preAcceptanceCase ]
          postEventState:
            in: [ Accepted, Rejected ]
        returns:
          taskId: SendEt1Notification
          name: Send ET1 Notification
          processCategories: Vetting
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ WA_REVIEW_RULE21_REFERRAL ]
          postEventState:
            in: [ Accepted ]
        returns:
          taskId: Rule21
          name: Rule 22
          processCategories: Rule21
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ WA_EXPIRED_BF_ACTION_TASK ]
          postEventState:
            in: [ Accepted, Rejected, Vetted, Submitted ]
        returns:
          taskId: ExpiredBfAction
          name: Expired Bf Action
          processCategories: ExpiredBfAction
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ submitEt3 ]
          postEventState:
            in: [ Accepted ]
        returns:
          taskId: ET3Processing
          name: ET3 Processing
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ amendRespondentDetails ]
          isECCReplyReceived:
            in: [ true ]
        returns:
          taskId: CompleteInitialConsideration
          name: Complete Initial Consideration
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ amendRespondentDetails ]
          et3FormReceived:
            in: [ true ]
        returns:
          taskId: ET3Processing
          name: ET3 Processing
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ et3Vetting ]
          postEventState:
            in: [ Accepted ]
          isThereAnEt3Response:
            in: [ false ]
        returns:
          taskId: ReviewRule21Referral
          name: Review Rule 22 Referral
          processCategories: Rule21
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ et3Vetting ]
          postEventState:
            in: [ Accepted ]
          isThereAnEt3Response:
            in: [ true ]
          isECC:
            in: [ false ]
        returns:
          taskId: CompleteInitialConsideration
          name: Complete Initial Consideration
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ et3Vetting ]
          postEventState:
            in: [ Accepted ]
          isThereAnEt3Response:
            in: [ true ]
          isECC:
            in: [ false ]
        returns:
          taskId: SendEt3Notification
          name: Send ET3 Notification
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ et3Vetting ]
          postEventState:
            in: [ Accepted ]
          isThereAnEt3Response:
            in: [ true ]
          isECC:
            in: [ true ]
        returns:
          taskId: ReferEmployersContractClaim
          name: Refer Employer's Contract Claim
          processCategories: Processing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ initialConsideration ]
          postEventState:
            in: [ Accepted ]
        returns:
          taskId: IssueInitialConsiderationDirections
          name: Issue Initial Consideration Directions
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ initialConsideration ]
          postEventState:
            in: [ Accepted ]
          listAHearing:
            in: [ true ]
        returns:
          taskId: ListAHearing
          name: List A Hearing
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ issueInitialConsiderationDirectionsWA ]
          postEventState:
            in: [ Accepted ]
        returns:
          taskId: IssueInitialConsiderationDirections
          name: Issue Initial Consideration Directions
          processCategories: Hearing
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ updateHearing ]
          postEventState:
            in: [ Accepted ]
          hearingsHeard:
            in: [ true ]
        returns:
          taskId: DraftAndSignJudgment
          name: Draft And Sign Judgment/Order
          processCategories: Judgment
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ SUBMIT_CLAIMANT_TSE ]
          submissionReasonApplication:
            in:
              - Amend my claim
              - Consider a decision afresh
              - Contact about something else
              - Order a witness to attend
              - Order respondent to do something
              - Postpone a hearing
              - Reconsider judgement
              - Restrict publicity
              - Tell tribunal respondent not complied
              - Vary/revoke an order
              - Strike out all/part of response
        returns:
          taskId: ContactTribunalWithAnApplication
          name:
            field: LATEST_APPLICATION_TASK_NAME
          processCategories: Application
      - only: [ et_englandwales, et_scotland ]
        when:
          eventId:
            in: [ CLAIMANT_TSE_RESPOND ]
          applicationResponseFrom:
            in: [ Claimant ]
          responseToApplicationType:
            in:
              - Amend my claim
              - Amend response
              - Claimant not complied
              - Consider a decision afresh
              - Contact about something else
