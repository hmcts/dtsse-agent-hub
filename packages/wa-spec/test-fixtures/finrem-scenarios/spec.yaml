      - name: canReconfigure
        label: Can Reconfigure?
        typeRef: boolean
    rows:
      - returns:
          name: calculatedDates
          value: nextHearingDate,dueDate,priorityDate
          canReconfigure: false
      - returns:
          name: priorityDateOriginRef
          value: nextHearingDate,dueDate
          canReconfigure: false
      - returns:
          name: nextHearingDate
          value:
            feel: |-
              if (caseData != null and caseData.listForHearings != null and
                          count(caseData.listForHearings[date(value.hearingDate) >= today()]) > 0) then
                          sort(caseData.listForHearings[date(value.hearingDate) >= today()], function(x,y)
                          date(y.value.hearingDate) > date(x.value.hearingDate))[1].value.hearingDate else ""
          canReconfigure: false
      - returns:
          name: dueDateNonWorkingCalendar
          value: https://www.gov.uk/bank-holidays/england-and-wales.json
          canReconfigure: false
      - returns:
          name: dueDateNonWorkingDaysOfWeek
          value: SATURDAY,SUNDAY
          canReconfigure: false
      - returns:
          name: dueDateSkipNonWorkingDays
          value: true
          canReconfigure: false
      - returns:
          name: dueDateMustBeWorkingDay
          value: No
          canReconfigure: false
      - returns:
          name: dueDateOrigin
          value:
            call: now
            args: []
          canReconfigure: false
      - returns:
          name: dueDateTime
          value:
            call: time
            args: [ 14:00 ]
          canReconfigure: false
      - returns:
          name: majorPriority
          value: 5000
          canReconfigure: false
      - returns:
          name: minorPriority
          value: 500
          canReconfigure: false
      - returns:
          name: caseName
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.applicantLName
                  op: exists
                - field: caseData.appRespondentLName
                  op: exists
            use:
              plus:
                - field: caseData.applicantLName
                - " vs "
                - field: caseData.appRespondentLName
            otherwise: Financial Remedy
          canReconfigure: false
      - returns:
          name: region
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseManagementLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.region
            otherwise: 2
          canReconfigure: false
      - returns:
          name: location
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseManagementLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.baseLocation
            otherwise: 195496
          canReconfigure: false
      - returns:
          name: caseManagementCategory
          value: FR Consented
          canReconfigure: false
