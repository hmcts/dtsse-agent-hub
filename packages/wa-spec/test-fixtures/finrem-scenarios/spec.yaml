decisions:
  initiation:
    name: Task initiation DMN
    hitPolicy: COLLECT
    historyTimeToLive: P90D
    inputs:
      - key: eventId
        label: Event Id
        variable: eventId
        typeRef: string
      - key: postEventState
        label: Post event state
        variable: postEventState
        typeRef: string
      - key: evidenceHandled
        label: Supplementary evidence handled
        variable: evidenceHandled
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.evidenceHandled
                op: exists
          use:
            field: additionalData.Data.evidenceHandled
          otherwise: false
      - key: pensionDocumentsCount
        label: Pension documents present
        variable: pensionDocumentsCount
        typeRef: integer
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.pensionCollection
                op: exists
          use:
            call: count
            args:
              - field: additionalData.Data.pensionCollection
          otherwise: 0
      - key: reviewRefusedHearingOrManualReason
        label: Hearing to be listed or manual refusal reason entered
        variable: reviewRefusedHearingOrManualReason
        typeRef: boolean
        expression:
          feel: if(additionalData != null and additionalData.Data != null and additionalData.Data.orderRefusalCollection != null and count(additionalData.Data.orderRefusalCollection) > 0) then ((additionalData.Data.orderRefusalCollection[-1].value.orderRefusal != null and list contains(additionalData.Data.orderRefusalCollection[-1].value.orderRefusal, "Hearing fixed for first available date")) or (additionalData.Data.orderRefusalCollection[-1].value.orderRefusalOther != null and additionalData.Data.orderRefusalCollection[-1].value.orderRefusalOther != "")) else false
      - key: helpWithFeesQuestion
        label: Help with fees
        variable: helpWithFeesQuestion
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.helpWithFeesQuestion
                op: exists
          use:
            field: additionalData.Data.helpWithFeesQuestion
          otherwise: false
    outputs:
      - name: taskId
        label: Task Id
        typeRef: string
      - name: name
        label: Name
        typeRef: string
      - name: delayDuration
        label: Delay Duration
        typeRef: integer
      - name: delayUntil
        label: Delay Until
        typeRef: json
      - name: processCategories
        label: Process Categories
        typeRef: string
    rows:
      - when:
          eventId:
            in: [ attachScannedDocs ]
          evidenceHandled:
            in: [ false ]
        returns:
          taskId: processScannedDocuments
          name: Process Scanned Documents
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_solUploadDocumentv2 ]
          postEventState:
            in: [ infoReceived ]
        returns:
          taskId: checkResponseReceived
          name: Check Response Received
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_approveApplication, FR_uploadApprovedOrder ]
          postEventState:
            in: [ consentOrderApproved ]
          pensionDocumentsCount:
            cmp: ">"
            value: 0
        returns:
          taskId: processApprovedOrder
          name: Process Approved Order
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_applicationPaymentSubmission ]
          postEventState:
            in: [ awaitingHWFDecision ]
          helpWithFeesQuestion:
            in: [ true ]
        returns:
          taskId: checkHelpWithFees
          name: Check Help With Fees
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_issueApplication, FR_referToJudgeFromRespondToOrder ]
          postEventState:
            in: [ referredToJudge ]
        returns:
          taskId: reviewApplication
          name: Review Application
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_orderRefusal ]
          postEventState:
            in: [ orderMade ]
          reviewRefusedHearingOrManualReason:
            in: [ true ]
        returns:
          taskId: reviewRefusedOrder
          name: Review Refused Order
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in:
              - FR_applicationPaymentSubmission
              - FR_caseSubmissionFromAwaitingInfo
              - FR_caseSubmissionFromInfoReceived
              - FR_paymentMadeFromHWF
              - FR_paymenetMade
              - FR_paymentMadeFromAwaitingPayment
