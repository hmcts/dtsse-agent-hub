              - FR_HWFDecisionMadeFromAwaitingPayment
          postEventState:
            in: [ applicationSubmitted ]
        returns:
          taskId: checkAndIssueApplication
          name: Check and Issue Application
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
      - when:
          eventId:
            in: [ FR_respondToOrder ]
          postEventState:
            in: [ responseReceived ]
        returns:
          taskId: reviewOrderResponse
          name: Review Order Response
          delayDuration: 0
          delayUntil:
            feel: |-
              {
                          "delayUntil": now(),
                          "delayUntilIntervalDays": "0"
                          }
  configuration:
