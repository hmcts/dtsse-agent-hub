          name: region
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.CaseAccessCategory
                  op: eq
                  value: UNSPEC_CLAIM
            use: "4"
            otherwise: "2"
          canReconfigure: true
      - only: [ civil ]
