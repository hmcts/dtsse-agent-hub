      - key: toggle
        label: Toggle
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.featureToggleWA
                op: exists
          use:
            field: additionalData.Data.featureToggleWA
          otherwise: null
        only: [ civil ]
      - key: preSDO
        label: Pre SDO (QM)
        variable: preSDO
        typeRef: boolean
        expression:
          feel: |-
            if postEventState = null then null else
            {
               "__preSdoStates": [
                 "CASE_ISSUED",
                 "AWAITING_CASE_DETAILS_NOTIFICATION",
                 "AWAITING_RESPONDENT_ACKNOWLEDGEMENT",
                 "AWAITING_APPLICANT_INTENTION",
                 "IN_MEDIATION",
                 "CASE_SETTLED",
                 "CASE_DISCONTINUED"
               ],
               "__state": if postEventState = "CASE_STAYED" then additionalData.Data.preStayState else postEventState,
               "__isPreSDO": list contains(__preSdoStates, __state)
            }.__isPreSDO
        only: [ civil ]
