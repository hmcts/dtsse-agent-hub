      - key: discontinuanceTaskType
        label: Discontinuance Task Type
        variable: discontinuanceTaskType
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.courtPermissionNeeded
                op: exists
              - field: additionalData.Data.courtPermissionNeeded
                op: eq
                value: YES
          use: VERIFY_COURT_PERMISSION
          otherwise:
            if:
              all:
                - field: additionalData
                  op: exists
                - field: additionalData.Data
                  op: exists
                - field: additionalData.Data.selectedClaimantForDiscontinuance
                  op: exists
                - field: additionalData.Data.selectedClaimantForDiscontinuance
                  op: ne
                  value: Both
                - field: additionalData.Data.courtPermissionNeeded
                  op: exists
                - field: additionalData.Data.courtPermissionNeeded
                  op: eq
                  value: NO
                - field: additionalData.Data.typeOfDiscontinuance
                  op: exists
                - field: additionalData.Data.typeOfDiscontinuance
                  op: eq
                  value: FULL_DISCONTINUANCE
            use: TAKE_OFFLINE
            otherwise:
              if:
                all:
                  - field: additionalData
                    op: exists
                  - field: additionalData.Data
                    op: exists
                  - field: additionalData.Data.isDiscontinuingAgainstBothDefendants
                    op: exists
                  - field: additionalData.Data.isDiscontinuingAgainstBothDefendants
                    op: eq
                    value: NO
                  - field: additionalData.Data.courtPermissionNeeded
                    op: exists
                  - field: additionalData.Data.courtPermissionNeeded
                    op: eq
                    value: NO
                  - field: additionalData.Data.typeOfDiscontinuance
                    op: exists
                  - field: additionalData.Data.typeOfDiscontinuance
                    op: eq
                    value: FULL_DISCONTINUANCE
              use: TAKE_OFFLINE
              otherwise:
                if:
                  all:
                    - field: additionalData
                      op: exists
                    - field: additionalData.Data
                      op: exists
                    - any:
                        - all:
                            - field: additionalData.Data.selectedClaimantForDiscontinuance
                              op: exists
                            - field: additionalData.Data.selectedClaimantForDiscontinuance
                              op: eq
                              value: Both
                        - field: additionalData.Data.selectedClaimantForDiscontinuance
                          op: notExists
                    - field: additionalData.Data.courtPermissionNeeded
                      op: exists
                    - field: additionalData.Data.courtPermissionNeeded
                      op: eq
                      value: NO
                    - field: additionalData.Data.typeOfDiscontinuance
                      op: exists
                    - field: additionalData.Data.typeOfDiscontinuance
                      op: eq
                      value: FULL_DISCONTINUANCE
                use: REMOVE_HEARING
                otherwise:
                  if:
                    all:
                      - field: additionalData
                        op: exists
                      - field: additionalData.Data
                        op: exists
                      - any:
                          - all:
                              - field: additionalData.Data.isDiscontinuingAgainstBothDefendants
                                op: exists
                              - field: additionalData.Data.isDiscontinuingAgainstBothDefendants
                                op: eq
                                value: YES
                          - field: additionalData.Data.isDiscontinuingAgainstBothDefendants
                            op: notExists
                      - field: additionalData.Data.courtPermissionNeeded
                        op: exists
                      - field: additionalData.Data.courtPermissionNeeded
                        op: eq
                        value: NO
                      - field: additionalData.Data.typeOfDiscontinuance
                        op: exists
                      - field: additionalData.Data.typeOfDiscontinuance
                        op: eq
                        value: FULL_DISCONTINUANCE
