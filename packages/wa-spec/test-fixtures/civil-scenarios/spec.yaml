          processCategories: uploadTranslatedDocuments
  configuration:
    name: Civil Task configuration DMN
    hitPolicy: COLLECT
    historyTimeToLive: P90D
    overrides:
      generalapplication:
        name: Civil GA Task configuration DMN
    inputs:
      - key: caseData
        label: CCD Case Data
        variable: caseData
        typeRef: string
      - key: toggle
        label: Toggle
        typeRef: string
        expression:
          if:
            all:
              - field: caseData
                op: exists
              - field: caseData
                op: exists
              - field: caseData.featureToggleWA
                op: exists
          use:
            field: caseData.featureToggleWA
          otherwise: null
        only: [ civil ]
      - key: taskType
        label: Task type
        variable: taskType
        typeRef: string
        expression:
          if:
            all:
              - field: taskAttributes
                op: exists
              - field: taskAttributes.taskType
                op: exists
          use:
            field: taskAttributes.taskType
          otherwise:
            if:
              field: taskType
              op: exists
            use:
              field: taskType
            otherwise: null
    outputs:
      - name: name
        label: Name
        typeRef: string
      - name: value
        label: Value
        typeRef: string
      - name: canReconfigure
        label: Can Reconfigure
        typeRef: string
    rows:
      - only: [ civil ]
        returns:
          name: caseName
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.applicant2
                  op: exists
            use:
              plus:
                - field: caseData.applicant1.partyName
                - " & "
                - field: caseData.applicant2.partyName
            otherwise:
              if:
                field: caseData
                op: exists
              use:
                field: caseData.applicant1.partyName
              otherwise: ""
          canReconfigure: true
      - only: [ civil ]
        when:
          taskType:
            notIn:
              - ReviewCaseFlagsForClaimant
              - ReviewCaseFlagsForDefendant
              - manualDetermination
              - damagesListCMCMulti
              - damagesListCCMCMulti
              - damagesListPTRMulti
              - damagesListTrialMulti
              - damagesListCMCInt
              - damagesListPTRInt
              - damagesListTrialInt
              - specifiedListCMCMulti
              - specifiedListCCMCMulti
              - specifiedListPTRMulti
              - specifiedListTrialMulti
              - specifiedListCMCInt
              - specifiedListPTRInt
              - specifiedListTrialInt
              - respondToQueryCTSC
              - transferCaseOfflineMinti
              - reviewMessageWLU
        returns:
          name: region
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseManagementLocation
                  op: exists
            use:
              field: caseData.caseManagementLocation.region
            otherwise: ""
          canReconfigure: true
      - only: [ civil ]
        when:
          taskType:
            in:
              - ReviewCaseFlagsForClaimant
              - ReviewCaseFlagsForDefendant
              - manualDetermination
              - respondToQueryCTSC
              - transferCaseOfflineMinti
