    helpers:
      - name: Non Working Days
        variable: false
        historyTimeToLive: P90D
        hitPolicy: FIRST
        inputs:
          - key: isScottishCase
            label: isScottishCase
            variable: isScottishCase
            typeRef: string
            expression:
              if:
                all:
                  - field: caseData
                    op: exists
                  - field: caseData.isScottishCase
                    op: exists
              use:
                field: caseData.isScottishCase
              otherwise: No
          - key: processingVenue
            label: processingVenue
            variable: processingVenue
            typeRef: string
            expression:
              if:
                all:
                  - field: caseData
                    op: exists
                  - field: caseData.processingVenue
                    op: exists
              use:
                field: caseData.processingVenue
              otherwise: null
        outputs:
          - name: nonWorkingDayCalendar
            typeRef: string
        rows:
          - when:
              isScottishCase:
                in: [ Yes ]
            returns:
              nonWorkingDayCalendar: https://www.gov.uk/bank-holidays/scotland.json
          - returns:
              nonWorkingDayCalendar: https://www.gov.uk/bank-holidays/england-and-wales.json
      - name: Next Hearing
        variable: false
        historyTimeToLive: P90D
        hitPolicy: FIRST
        inputs:
          - key: hearings
            label: hearings
            variable: hearings
            typeRef: ""
        outputs:
          - name: nextHearingDate
            typeRef: string
          - name: nextHearingId
            typeRef: string
          - name: nextHearingVenue
            typeRef: string
        rows:
          - when:
              hearings:
                feel: hearings!=null and hearings[1]!=null
            returns:
              nextHearingDate:
                field: hearings[1].value.hearingDate
              nextHearingId:
                field: hearings[1].value.hearingId
              nextHearingVenue:
                if:
                  field: hearings[1].value.venue
                  op: exists
                use:
                  field: hearings[1].value.venue.name
                otherwise: null
      - name: Get Current Hearings
        variable: false
        historyTimeToLive: P90D
        hitPolicy: FIRST
        inputs:
          - key: caseData
            label: CaseData
            variable: caseData
            typeRef: ""
        outputs:
          - name: hearings
            label: hearings
            typeRef: ""
        rows:
          - when:
              caseData:
                feel: caseData.hearings!=null
            returns:
              hearings:
                feel: "sort(list: caseData.hearings[date(value.hearingDate)>=today()], precedes: function(x,y) x.value.hearingDate < y.value.hearingDate)"
          - returns:
              hearings: null
    dependencies:
      - decision: table
        requires: Non Working Days
      - decision: table
        requires: Next Hearing
      - decision: Next Hearing
        requires: Get Current Hearings
