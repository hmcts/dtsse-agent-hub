    helpers:
      - name: Date Calculation Defaults
        variable: false
        historyTimeToLive: P90D
        hitPolicy: UNIQUE
        inputs:
          - key: input
            typeRef: string
        outputs:
          - name: date_defaults_1
            label: date_defaults_1
            typeRef: ""
        rows:
          - returns:
              date_defaults_1:
                feel: |-
                  {
                    delayUntilOrigin: today(),
                    delayUtilNonWorkingCalendar: nonWorkingDayCalendar
                  }
      - name: Non Working Days
        variable: false
        hitPolicy: FIRST
        inputs:
          - key: isScottishCase
            label: isScottishCase
            variable: isScottishCase
            typeRef: string
            expression:
              if:
                all:
                  - field: additionalData
                    op: exists
                  - field: additionalData.Data
                    op: exists
                  - field: additionalData.Data.isScottishCase
                    op: exists
              use:
                field: additionalData.Data.isScottishCase
              otherwise: null
          - key: processingVenue
            label: processingVenue
            variable: processingVenue
            typeRef: string
            expression:
              if:
                all:
                  - field: additionalData
                    op: exists
                  - field: additionalData.Data
                    op: exists
                  - field: additionalData.Data.processingVenue
                    op: exists
              use:
                field: additionalData.Data.processingVenue
              otherwise: null
        outputs:
          - name: nonWorkingDayCalendar
            label: nonWorkingDayCalendar
            typeRef: string
        rows:
          - when:
              isScottishCase:
                in: [ Yes ]
            returns:
              nonWorkingDayCalendar: https://www.gov.uk/bank-holidays/scotland.json
          - returns:
              nonWorkingDayCalendar: https://www.gov.uk/bank-holidays/england-and-wales.json
      - name: Interloc Referral Reason
        variable: false
        historyTimeToLive: P90D
        hitPolicy: FIRST
        inputs:
          - key: interlocReferralReason
            label: Interloc referal reason
            variable: interlocReferralReason
            typeRef: string
            expression:
              if:
                all:
                  - field: additionalData
                    op: exists
                  - field: additionalData.Data
                    op: exists
                  - field: additionalData.Data.interlocReferralReason
                    op: exists
              use:
                field: additionalData.Data.interlocReferralReason
              otherwise: null
        outputs:
          - name: interlocReferralReasonLabel
            label: Label
            typeRef: string
        rows:
          - when:
              interlocReferralReason:
                feel: "null"
            returns:
              interlocReferralReasonLabel: null
          - when:
              interlocReferralReason:
                in:
                  - confirmPanelCompositionAndListingDirections
            returns:
              interlocReferralReasonLabel: Confirm panel composition and listing directions
          - when:
              interlocReferralReason:
                in: [ reviewPostponementRequest ]
            returns:
              interlocReferralReasonLabel: Review hearing postponement request
          - when:
              interlocReferralReason:
                in: [ timeExtension ]
            returns:
              interlocReferralReasonLabel: Time extension
          - when:
              interlocReferralReason:
                in: [ reviewAudioVideoEvidence ]
            returns:
              interlocReferralReasonLabel: Review A/V evidence
          - when:
              interlocReferralReason:
                in: [ rejectHearingRecordingRequest ]
            returns:
              interlocReferralReasonLabel: Reject hearing recording request
          - when:
              interlocReferralReason:
                in: [ postHearingRequest ]
            returns:
              interlocReferralReasonLabel: Post Hearing Request
          - when:
              interlocReferralReason:
                in: [ phmeRequest ]
            returns:
              interlocReferralReasonLabel: PHE request
          - when:
              interlocReferralReason:
                in: [ over300Pages ]
            returns:
              interlocReferralReasonLabel: Over 300 pages
          - when:
              interlocReferralReason:
                in: [ over13months ]
            returns:
              interlocReferralReasonLabel: Over 13 months
          - when:
              interlocReferralReason:
                in: [ noResponseToDirection ]
            returns:
              interlocReferralReasonLabel: No response to a direction
          - when:
              interlocReferralReason:
                in: [ noMrn ]
            returns:
              interlocReferralReasonLabel: No MRN
          - when:
              interlocReferralReason:
                in: [ listingDirections ]
            returns:
              interlocReferralReasonLabel: Listing Directions
          - when:
              interlocReferralReason:
                in: [ over13MonthsAndGroundsMissing ]
            returns:
              interlocReferralReasonLabel: Grounds for appeal missing
          - when:
              interlocReferralReason:
                in: [ complexCase ]
            returns:
              interlocReferralReasonLabel: Complex Case
          - when:
              interlocReferralReason:
                in: [ adviceOnHowToProceed ]
            returns:
              interlocReferralReasonLabel: Advice on how to proceed
    dependencies:
      - decision: table
        requires: Date Calculation Defaults
      - decision: table
        requires: Interloc Referral Reason
      - decision: Date Calculation Defaults
        requires: Non Working Days
  configuration:
    name: Task configuration DMN
    hitPolicy: COLLECT
    inputs:
      - key: caseData
        label: CCD Case Data
        variable: caseData
        typeRef: string
      - key: taskType
        label: Task type
        variable: taskType
        typeRef: string
        expression:
          if:
            all:
              - field: taskAttributes
                op: exists
              - field: taskAttributes.taskType
                op: exists
          use:
            field: taskAttributes.taskType
          otherwise:
            if:
              field: taskType
              op: exists
            use:
              field: taskType
            otherwise: null
    outputs:
      - name: name
        label: Name
        typeRef: string
      - name: value
        label: Value
        typeRef: string
      - name: canReconfigure
        label: Can Reconfigure?
        typeRef: boolean
    rows:
      - returns:
          name: caseName
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseNamePublic
                  op: exists
            use:
              field: caseData.caseNamePublic
            otherwise: ""
          canReconfigure: true
      - returns:
          name: caseManagementCategory
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseManagementCategory
                  op: exists
            use:
              field: caseData.caseManagementCategory.value.label
            otherwise: ""
          canReconfigure: true
      - returns:
          name: region
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.caseManagementLocation
                  op: exists
                - field: caseData.caseManagementLocation.region
                  op: exists
            use:
              field: caseData.caseManagementLocation.region
            otherwise: ""
          canReconfigure: true
      - description: Location Id
        returns:
          name: location
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.regionalProcessingCenter
                  op: exists
                - field: caseData.regionalProcessingCenter.epimsId
                  op: exists
            use:
              field: caseData.regionalProcessingCenter.epimsId
            otherwise: ""
          canReconfigure: true
      - description: Short name
        returns:
          name: locationName
          value:
            if:
              all:
                - field: caseData
                  op: exists
                - field: caseData.regionalProcessingCenter
                  op: exists
                - field: caseData.regionalProcessingCenter.name
                  op: exists
            use:
              if:
                field: nextHearingVenue
                op: exists
              use:
                plus:
                  - field: caseData.regionalProcessingCenter.name
                  - " - "
                  - field: nextHearingVenue
              otherwise:
                field: caseData.regionalProcessingCenter.name
            otherwise: ""
          canReconfigure: true
