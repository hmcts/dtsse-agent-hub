# Imported by wa-spec from the DMNs of hmcts/sscs-task-configuration@a3d3c0cd99c39be7614135158a7f155e6625e64b
version: 1
service:
  slug: sscs
caseTypes:
  - id: benefit
decisions:
  initiation:
    name: Task initiation DMN
    hitPolicy: COLLECT
    historyTimeToLive: P90D
    inputs:
      - key: eventId
        label: Event Id
        variable: eventId
        typeRef: string
      - key: postEventState
        label: Post event state
        variable: postEventState
        typeRef: string
      - key: ftaResponseReviewRequired
        label: FTA Response Review Required
        variable: ftaResponseReviewRequired
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.ftaResponseReviewRequired
                op: exists
          use:
            field: additionalData.Data.ftaResponseReviewRequired
          otherwise: true
      - key: languagePreferenceWelsh
        label: Language Preference Welsh
        variable: languagePreferenceWelsh
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.languagePreferenceWelsh
                op: exists
          use:
            field: additionalData.Data.languagePreferenceWelsh
          otherwise: null
      - key: scannedDocumentTypes
        label: Scanned Document Types
        variable: scannedDocumentTypes
        typeRef: string
        expression:
          feel: |-
            if(additionalData != null and additionalData.Data != null and additionalData.Data.scannedDocumentTypes
                        != null) then
                        additionalData.Data.scannedDocumentTypes
                        else
             []
      - key: workType
        label: Work Type
        variable: workType
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.workType
                op: exists
          use:
            field: additionalData.Data.workType
          otherwise: null
      - key: dwpEditedEvidenceReason
        label: DWP  Edited Evidence Reason
        variable: dwpEditedEvidenceReason
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.dwpEditedEvidenceReason
                op: exists
          use:
            field: additionalData.Data.dwpEditedEvidenceReason
          otherwise: null
      - key: action
        label: Action
        variable: action
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.action
                op: exists
          use:
            field: additionalData.Data.action
          otherwise: null
      - key: panel
        label: Panel Count
        variable: panel
        typeRef: integer
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.panel
                op: exists
          use:
            plus:
              - if:
                  field: additionalData.Data.panel.assignedTo
                  op: exists
                use: 1
                otherwise: 0
              - if:
                  field: additionalData.Data.panel.medicalMember
                  op: exists
                use: 1
                otherwise: 0
              - if:
                  field: additionalData.Data.panel.disabilityQualifiedMember
                  op: exists
                use: 1
                otherwise: 0
          otherwise: 0
      - key: benefitCode
        label: Benefit Code
        variable: benefitCode
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.benefitCode
                op: exists
          use:
            field: additionalData.Data.benefitCode
          otherwise: null
      - key: daysToHearing
        label: Days to Hearing
        variable: daysToHearing
        typeRef: integer
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.daysToHearing
                op: exists
          use:
            field: additionalData.Data.daysToHearing
          otherwise: null
      - key: assignedCaseRoles
        label: Assigned Case Roles
        variable: assignedCaseRoles
        typeRef: string
        expression:
          feel: |-
            if(additionalData != null
                and additionalData.Data != null
                and additionalData.Data.assignedCaseRoles!= null) then additionalData.Data.assignedCaseRoles
            else
                 []
      - key: directionType
        label: Direction Type
        variable: directionType
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.directionTypeDl
                op: exists
              - field: additionalData.Data.directionTypeDl.value
                op: exists
              - field: additionalData.Data.directionTypeDl.value.code
                op: exists
          use:
            field: additionalData.Data.directionTypeDl.value.code
          otherwise: null
      - key: hearingRecordingCount
        label: Hearing Recording Count
        variable: hearingRecordingCount
        typeRef: integer
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.sscsHearingRecordings
                op: exists
          use:
            call: count
            args:
              - field: additionalData.Data.sscsHearingRecordings
          otherwise: 0
      - key: interlocReferralReason
        label: Interloc Referral Reason
        variable: interlocReferralReason
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.interlocReferralReason
                op: exists
          use:
            field: additionalData.Data.interlocReferralReason
          otherwise: null
      - key: furtherEvidenceAction
        label: Further Evidence Action
        variable: furtherEvidenceAction
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.furtherEvidenceAction
                op: exists
              - field: additionalData.Data.furtherEvidenceAction.value
                op: exists
          use:
            field: additionalData.Data.furtherEvidenceAction.value.code
          otherwise: null
      - key: requestStatementOfReasons
        label: Request Statement of Reasons
        variable: requestStatementOfReasons
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.setAside
                op: exists
              - field: additionalData.Data.setAside.requestStatementOfReasons
                op: exists
          use:
            field: additionalData.Data.setAside.requestStatementOfReasons
          otherwise: null
      - key: decisionDates
        label: Decision Dates
        variable: decisionDates
        typeRef: ""
        expression:
          feel: |-
            if(additionalData != null and additionalData.Data != null) then
              if(additionalData.Data.issueFinalDecisionDate!=null) then
                if(additionalData.Data.issueInterlocDecisionDate!=null) then
                  [additionalData.Data.issueFinalDecisionDate, additionalData.Data.issueInterlocDecisionDate]
                else
                  [additionalData.Data.issueFinalDecisionDate]

              else if(additionalData.Data.issueInterlocDecisionDate!=null) then
                [additionalData.Data.issueInterlocDecisionDate]
              else []
            else []
      - key: additionalParties
        label: Additional Parties
        variable: additionalParties
        typeRef: boolean
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.jointParty
                op: exists
              - field: additionalData.Data.jointParty
                op: eq
                value: Yes
          use: true
          otherwise:
            if:
              all:
                - field: additionalData
                  op: exists
                - field: additionalData.Data
                  op: exists
                - field: additionalData.Data.otherParties
                  op: exists
                - left:
                    call: count
                    args:
                      - field: additionalData.Data.otherParties
                  op: gt
                  right: 0
            use: true
            otherwise: false
      - key: postHearingReviewType
        label: Post Hearing Review Type
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.postHearingReviewType
                op: exists
          use:
            field: additionalData.Data.postHearingReviewType
          otherwise: null
      - key: issueFinalDecisionDate
        label: Issue Final Decision Date
        variable: issueFinalDecisionDate
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.issueFinalDecisionDate
                op: exists
          use:
            field: additionalData.Data.issueFinalDecisionDate
          otherwise: null
      - key: sendToFirstTierAction
        label: Send To First Tier Action
        variable: sendToFirstTierAction
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.sendToFirstTier
                op: exists
          use:
            field: additionalData.Data.sendToFirstTier.action
          otherwise: null
      - key: action2
        label: Action Option
        variable: action
        typeRef: string
        expression:
          if:
            all:
              - field: additionalData
                op: exists
              - field: additionalData.Data
                op: exists
              - field: additionalData.Data.action
                op: exists
              - field: additionalData.Data.action.value
                op: exists
          use:
            field: additionalData.Data.action.value.code
          otherwise: null
    outputs:
      - name: taskId
        label: Task Id
        typeRef: string
      - name: name
        label: Name
        typeRef: string
      - name: delayDuration
        label: Delay Duration
        typeRef: integer
      - name: workingDaysAllowed
        label: Working Days Allowed
        typeRef: integer
      - name: processCategories
        label: Process Categories Identifiers
        typeRef: string
    rows:
      - when:
          eventId:
            in: [ draftToIncompleteApplication, incompleteApplicationReceived ]
        returns:
          taskId: reviewIncompleteAppeal
          name: CTSC - Review Incomplete Appeal
          workingDaysAllowed: 5
          processCategories: reviewIncompleteAppeal
      - when:
          eventId:
            in: [ dwpUploadResponse ]
          ftaResponseReviewRequired:
            in: [ true ]
        returns:
          taskId: reviewFtaResponse
          name: CTSC - Review FTA Response
          workingDaysAllowed: 2
          processCategories: reviewFtaResponse
      - when:
          eventId:
            in: [ dwpSupplementaryResponse, uploadDocument, attachScannedDocs, uploadDocumentFurtherEvidence ]
          languagePreferenceWelsh:
            in: [ true ]
        returns:
          taskId: reviewBilingualDocument
          name: Review Bi-Lingual Document - CTSC
          workingDaysAllowed: 10
          processCategories: Translation Tasks
      - when:
          eventId:
            in: [ sendToAdmin ]
        returns:
          taskId: reviewAdminAction
          name: CTSC - Review Admin Action
          workingDaysAllowed: 5
          processCategories: reviewAdminAction
      - when:
          eventId:
            in: [ dwpSupplementaryResponse, attachScannedDocs, uploadDocumentFurtherEvidence ]
          postEventState:
            notIn: [ dormantAppealState, postHearing ]
          scannedDocumentTypes:
            feel: |-
              not(contains(scannedDocumentTypes, "audioDocument") or
              contains(scannedDocumentTypes, "videoDocument"))
        returns:
          taskId: actionUnprocessedCorrespondence
          name: CTSC - Action Unprocessed Correspondence
          workingDaysAllowed: 10
          processCategories: actionUnprocessedCorrespondence
      - when:
          eventId:
            in: [ dwpSupplementaryResponse, attachScannedDocs, uploadDocumentFurtherEvidence ]
          postEventState:
            in: [ dormantAppealState, postHearing ]
          scannedDocumentTypes:
            feel: |-
              not(contains(scannedDocumentTypes, "audioDocument") or
              contains(scannedDocumentTypes, "videoDocument"))
        returns:
          taskId: actionUnprocessedCorrespondenceDormant
          name: CTSC - Action Unprocessed Correspondence - Dormant/Post Hearing
          workingDaysAllowed: 10
          processCategories: actionUnprocessedCorrespondenceDormant
      - when:
          eventId:
            in: [ sentToDwp ]
          postEventState:
            in: [ withDwp ]
        returns:
          taskId: reviewFtaDueDate
          name: Review FTA Due Date - CTSC
          delayDuration:
            feel: |-
              if (additionalData != null and additionalData.Data != null and additionalData.Data.dwpDueDate!= null and additionalData.Data.dwpDueDate!= "")
              	then (date(additionalData.Data.dwpDueDate) - today()).days
              else 0
          workingDaysAllowed: 2
          processCategories: reviewFtaDueDate
      - when:
          eventId:
            in: [ actionFurtherEvidence, manageWelshDocuments ]
          scannedDocumentTypes:
            feel: contains(scannedDocumentTypes, "confidentialityRequest")
        returns:
          taskId: reviewConfidentialityRequest
          name: Review Confidentiality Request - Judge
          workingDaysAllowed: 2
          processCategories: reviewConfidentialityRequest
      - when:
          eventId:
            in: [ manageWelshDocuments ]
          scannedDocumentTypes:
            feel: contains(scannedDocumentTypes, "urgentHearingRequest")
        returns:
          taskId: reviewUrgentHearingRequest
          name: Review Urgent Hearing Request - Judge
          workingDaysAllowed: 2
          processCategories: reviewUrgentHearingRequest
      - when:
          eventId:
            in: [ makeCaseUrgent ]
        returns:
          taskId: reviewUrgentHearingRequest
          name: Review Urgent Hearing Request - Judge
          workingDaysAllowed: 2
          processCategories: reviewUrgentHearingRequest
      - when:
          eventId:
            in: [ tcwReferToJudge ]
          workType:
            in: [ pre ]
        returns:
          taskId: referredByTcwPreHearing
          name: Referred By TCW - Judge
          workingDaysAllowed: 2
          processCategories: referredByTcwPreHearing
      - when:
          eventId:
            in: [ createBundle, newCaseRolesAssigned ]
          assignedCaseRoles:
            feel: contains(assignedCaseRoles,"hearing-judge")
        returns:
          taskId: prepareForHearingJudge
          name: Prepare For Hearing - Judge
          workingDaysAllowed: 2
          processCategories: prepareForHearingJudge
      - when:
          eventId:
            in: [ hearingToday ]
        returns:
          taskId: writeDecisionJudge
          name: Write Decision - Judge
          workingDaysAllowed: 2
          processCategories: writeDecisionJudge
      - when:
          eventId:
            in: [ actionFurtherEvidence, manageWelshDocuments ]
          scannedDocumentTypes:
            feel: contains(scannedDocumentTypes, "reinstatementRequest")
        returns:
          taskId: reviewReinstatementRequestJudge
          name: Review Reinstatement Request - Judge
          workingDaysAllowed: 2
          processCategories: reviewReinstatementRequestJudge
      - when:
          eventId:
            in: [ updateNotListable ]
          action:
            in: [ reviewByJudge ]
        returns:
          taskId: ftaNotProvidedAppointeeDetailsJudge
          name: FTA not Provided Appointee Details - Judge
          workingDaysAllowed: 2
          processCategories: ftaNotProvidedAppointeeDetailsJudge
      - when:
          eventId:
            in: [ actionPostponementRequest ]
          action:
            in: [ reviewByJudge ]
        returns:
          taskId: reviewPostponementRequestJudge
          name: Review Postponement Request - Judge
          workingDaysAllowed: 2
          processCategories: reviewPostponementRequestJudge
      - when:
          eventId:
            in: [ actionPostponementRequest ]
          action:
            in: [ reviewByTcw ]
        returns:
          taskId: reviewPostponementRequestTCW
          name: Review postponement request - LO
          workingDaysAllowed: 2
          processCategories: reviewPostponementRequestTCW
      - when:
          eventId:
            in: [ validAppealCreated ]
          postEventState:
            in: [ validAppeal ]
        returns:
          taskId: reviewValidAppeal
          name: CTSC - Review Valid Appeal
          delayDuration: 1
          workingDaysAllowed: 5
          processCategories: reviewValidAppeal
      - when:
          eventId:
            in: [ readyToList, listingError ]
          postEventState:
            in: [ listingError ]
        returns:
          taskId: reviewListingError
          name: CTSC - Review Listing Error
          workingDaysAllowed: 3
          processCategories: reviewListingError
      - when:
          eventId:
            in: [ sendToRoboticsError ]
        returns:
          taskId: reviewRoboticFail
          name: CTSC - Review Robotic Fail
          workingDaysAllowed: 3
          processCategories: reviewRoboticFail
      - when:
          eventId:
            in: [ directionDueToday ]
        returns:
          taskId: reviewBfDate
          name: Review BF Date - CTSC
          workingDaysAllowed: 5
          processCategories: reviewBfDate
      - when:
          eventId:
            in: [ prepareForHearing ]
        returns:
          taskId: allocateCaseRolesAndCreateBundle
          name: Allocate Case Roles and Create Bundle - RPC
          workingDaysAllowed: 3
          processCategories: allocateCaseRolesAndCreateBundle
      - when:
          eventId:
            in: [ validSendToInterloc ]
          workType:
            in: [ pre ]
          action:
            in: [ reviewByJudge ]
          interlocReferralReason:
            in: [ adviceOnHowToProceed ]
        returns:
          taskId: referredByAdminJudgePreHearing
          name: Referred By Admin - Judge
          workingDaysAllowed: 2
          processCategories: referredByAdminJudgePreHearing
      - when:
          eventId:
            in: [ hmctsResponseReviewed ]
          interlocReferralReason:
            in:
              - confirmPanelCompositionAndListingDirections
          action2:
            in: [ reviewByJudge ]
        returns:
          taskId: confirmPanelComposition
          name: Confirm Panel Composition - Judge
          workingDaysAllowed: 2
          processCategories: confirmPanelComposition
      - when:
          eventId:
            in: [ dwpRequestTimeExtension ]
        returns:
          taskId: ftaRequestTimeExtension
          name: Request FTA Time Extension - LO
          workingDaysAllowed: 2
          processCategories: ftaRequestTimeExtension
      - when:
          eventId:
            in: [ validSendToInterloc ]
          action:
            in: [ reviewByJudge ]
          interlocReferralReason:
            feel: |-
              not(list contains([
              "reviewPostponementRequest",
              "listingDirections",
              "confirmPanelCompositionAndListingDirections",
              "adviceOnHowToProceed",
              "reviewCorrectionRequest",
              "reviewSetAsideApplication",
              "reviewCorrectionApplication",
              "statementOfReasonsApplication",
              "lateStatementOfReasonsApplication",
              "reviewPermissionToAppealApplication",
              "reviewLibertyToApplyApplication",
              "reviewUpperTribunalDecision",
              "reviewReinstatementRequest",
              "reviewConfidentialityRequest"],
              interlocReferralReason))
        returns:
          taskId: referredToInterlocJudge
          name:
            if:
              field: interlocReferralReasonLabel
              op: exists
            use:
              plus:
                - "Referred to interloc - "
                - field: interlocReferralReasonLabel
                - " - Judge"
            otherwise: Referred to interloc - Judge
          workingDaysAllowed: 2
          processCategories: referredToInterlocJudge
      - when:
          eventId:
            in: [ actionPostponementRequest ]
          daysToHearing:
            cmp: <
            value: 7
        returns:
          taskId: contactParties
          name: Contact Parties - RPC
          workingDaysAllowed: 1
          processCategories: contactParties
      - when:
          eventId:
            in: [ actionFurtherEvidence ]
          postEventState:
            in: [ dormantAppealState, postHearing ]
          scannedDocumentTypes:
            feel: contains(scannedDocumentTypes, "correctionApplication")
          furtherEvidenceAction:
            in: [ adminActionCorrection ]
        returns:
          taskId: reviewCorrectionApplicationAdmin
          name: Review Correction Application - CTSC
          workingDaysAllowed: 3
          processCategories: reviewCorrectionApplicationAdmin
      - when:
          eventId:
            in: [ dwpChallengeValidity ]
        returns:
          taskId: reviewFtaValidityChallenge
          name: Review FTA validity challenge - LO
          workingDaysAllowed: 2
          processCategories: reviewFtaValidityChallenge
      - when:
          eventId:
            in: [ createBundle, newCaseRolesAssigned ]
          assignedCaseRoles:
            feel: contains(assignedCaseRoles,"tribunal-member-1")
        returns:
          taskId: prepareForHearingTribunalMember1
          name: Prepare for hearing - Tribunal Member 1
          workingDaysAllowed: 2
          processCategories: prepareForHearingTribunalMember
      - when:
          eventId:
            in: [ createBundle, newCaseRolesAssigned ]
          assignedCaseRoles:
            feel: contains(assignedCaseRoles,"tribunal-member-2")
        returns:
          taskId: prepareForHearingTribunalMember2
          name: Prepare for hearing - Tribunal Member 2
          workingDaysAllowed: 2
          processCategories: prepareForHearingTribunalMember
      - when:
          eventId:
            in: [ createBundle, newCaseRolesAssigned ]
          assignedCaseRoles:
            feel: contains(assignedCaseRoles,"tribunal-member-3")
        returns:
          taskId: prepareForHearingTribunalMember3
          name: Prepare for hearing - Tribunal Member 3
          workingDaysAllowed: 2
          processCategories: prepareForHearingTribunalMember
      - when:
          eventId:
            in: [ manageWelshDocuments ]
          scannedDocumentTypes:
            feel: contains(scannedDocumentTypes, "postponementRequest")
        returns:
          taskId: reviewPostponementRequestTCW
          name: Review postponement request - LO
          workingDaysAllowed: 2
          processCategories: reviewPostponementRequestTCW
      - when:
          eventId:
            in: [ postponementRequest ]
        returns:
          taskId: reviewPostponementRequestTCW
          name: Review postponement request - LO
          workingDaysAllowed: 2
          processCategories: reviewPostponementRequestTCW
      - when:
          eventId:
            in: [ validSendToInterloc ]
          action:
            in: [ postponementRequestInterlocSendToTcw ]
          interlocReferralReason:
            feel: |-
              not(list contains(["reviewPostponementRequest","confirmPanelCompositionAndListingDirections"],
              interlocReferralReason))
        returns:
          taskId: reviewPostponementRequestTCW
          name: Review postponement request - LO
          workingDaysAllowed: 2
          processCategories: reviewPostponementRequestTCW
      - when:
          eventId:
            in: [ validSendToInterloc ]
          action:
            in: [ reviewByTcw ]
          interlocReferralReason:
            feel: |-
              not(list contains(["reviewPostponementRequest","confirmPanelCompositionAndListingDirections", "adviceOnHowToProceed"],
              interlocReferralReason))
        returns:
          taskId: referredToInterlocTCW
          name:
            if:
              field: interlocReferralReasonLabel
              op: exists
            use:
              plus:
                - "Referred to interloc - "
                - field: interlocReferralReasonLabel
                - " - LO"
            otherwise: Referred to interloc - LO
          workingDaysAllowed: 2
          processCategories: referredToInterlocTCW
      - when:
          eventId:
            in: [ nonCompliantSendToInterloc ]
          interlocReferralReason:
            feel: |-
              not(list contains(["reviewPostponementRequest","confirmPanelCompositionAndListingDirections"],
              interlocReferralReason))
        returns:
          taskId: referredToInterlocTCW
          name:
            if:
              field: interlocReferralReasonLabel
              op: exists
            use:
              plus:
                - "Referred to interloc - "
                - field: interlocReferralReasonLabel
                - " - LO"
            otherwise: Referred to interloc - LO
          workingDaysAllowed: 2
          processCategories: referredToInterlocTCW
      - when:
          eventId:
            in: [ sentToDwp ]
        returns:
          taskId: ftaResponseOverdue
          name: Referred to Interloc - FTA response overdue - LO
          delayDuration:
            if:
              all:
                - field: additionalData
                  op: exists
                - field: additionalData.Data
                  op: exists
                - field: additionalData.Data.caseManagementCategory
                  op: exists
                - field: additionalData.Data.caseManagementCategory.value
                  op: exists
                - field: additionalData.Data.caseManagementCategory.value.code
                  op: exists
                - field: additionalData.Data.caseManagementCategory.value.code
                  op: eq
                  value: childSupport
            use: 42
            otherwise: 28
          workingDaysAllowed: 2
          processCategories: ftaResponseOverdue
      - when:
          eventId:
            in: [ directionDueToday ]
          directionType:
            in: [ grantExtension ]
        returns:
          taskId: ftaResponseOverdue
          name: Referred to Interloc - FTA response overdue - LO
          workingDaysAllowed: 2
          processCategories: ftaResponseOverdue
      - when:
          eventId:
            in: [ interlocSendToTcw ]
        returns:
          taskId: referredByJudge
          name: Referred By Judge - LO
          workingDaysAllowed: 2
          processCategories: referredByJudge
      - when:
          eventId:
            in:
              - uploadDocument
              - dwpSupplementaryResponse
              - dwpUploadResponse
              - uploadFurtherEvidence
              - uploadDocumentFurtherEvidence
          scannedDocumentTypes:
            feel: |-
              contains(scannedDocumentTypes, "audioDocument") or

              contains(scannedDocumentTypes, "videoDocument")
        returns:
          taskId: processAudioVideoEvidence
          name: Process audio/video evidence - LO
          workingDaysAllowed: 2
          processCategories: processAudioVideoEvidence
      - when:
          eventId:
            in: [ draftToNonCompliant, nonCompliant ]
        returns:
          taskId: reviewNonCompliantAppeal
          name: Review Non Compliant Appeal - LO
          workingDaysAllowed: 2
          processCategories: reviewNonCompliantAppeal
      - when:
          eventId:
            in: [ validSendToInterloc ]
          action:
            in: [ reviewByTcw ]
          interlocReferralReason:
            in: [ adviceOnHowToProceed ]
        returns:
          taskId: referredByAdminTcw
          name: Referred by Admin - LO
          workingDaysAllowed: 2
